rt is a tessellation either way. The\n  first version of the gate test asserted on it and failed at 520 polygons for a\n  40-face solid. The BREP claim has to be made against engine facts, not against\n  `obj.data.polygons`.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 5ade410f356d0d5f194ebf00b7f49a69163bdc52\n\n## State Impact\n\n- target: forest-wind-0342 \u2014 The engine gains linked parts (ADR-138): a new `link_part` MODELING_OP pulls one accepted solid out of another project's pinned accepted attempt as a `.cxpart` container (pure file reading \u2014 no FreeCAD, no worker, no OCCT call, and the source project never opens), and `part.import_part` reads it back as the exact OCCT solid. New engine module `CadexLinkedPart.py`, in both DECLARED_ENGINE_MODULES and the project worker bundle. Part domain is 50 -> 51 operations. Refresh is the same call again; `changed` says whether the source moved. No new output type, no new artifact_kind, no change to compute_project_digest. Suite count 1,698 -> 1,723 passed / 22 skipped. Answers the parked open question of how projects compose: one flat script each, joined by content-addressed files, not sub-scripts or imports.\n- target: shy-crane-2573 \u2014 The shell gains File > Link Part... and File > Refresh Linked Parts, a `link_part` MCP tool (17 tools), and the backend trio link_part/linked_parts/refresh_linked_parts (ADR-138). Also fixes a real defect: `_assets_in` filtered Save-As's carry-forward on the three-suffix ASSET_SUFFIXES, so a Save-As would have dropped every .cxpart and left the new file with a script that could not run \u2014 ADR-046's bug on a new file type, now pinned by the gate. Shell diff +541/-5 across six files, all under mesh_agent/ or tests/python/; BLENDER-TREE.md section 2a still eight files.\n","is_root":false,"is_hwm":false,"unreconciled":true,"impacts":[{"target":"forest-wind-0342","resolved":"forest-wind-0342","delta":"The engine gains linked parts (ADR-138): a new `link_part` MODELING_OP pulls one accepted solid out of another project's pinned accepted attempt as a `.cxpart` container (pure file reading \u2014 no FreeCAD, no worker, no OCCT call, and the source project never opens), and `part.import_part` reads it back as the exact OCCT solid. New engine module `CadexLinkedPart.py`, in both DECLARED_ENGINE_MODULES and the project worker bundle. Part domain is 50 -> 51 operations. Refresh is the same call again; `changed` says whether the source moved. No new output type, no new artifact_kind, no change to compute_project_digest. Suite count 1,698 -> 1,723 passed / 22 skipped. Answers the parked open question of how projects compose: one flat script each, joined by content-addressed files, not sub-scripts or imports.","new":false},{"target":"shy-crane-2573","resolved":"shy-crane-2573","delta":"The shell gains File > Link Part... and File > Refresh Linked Parts, a `link_part` MCP tool (17 tools), and the backend trio link_part/linked_parts/refresh_linked_parts (ADR-138). Also fixes a real defect: `_assets_in` filtered Save-As's carry-forward on the three-suffix ASSET_SUFFIXES, so a Save-As would have dropped every .cxpart and left the new file with a script that could not run \u2014 ADR-046's bug on a new file type, now pinned by the gate. Shell diff +541/-5 across six files, all under mesh_agent/ or tests/python/; BLENDER-TREE.md section 2a still eight files.","new":false}],"impact_none":null,"layer":14,"order":0,"seq":19,"chrono":19,"lane":1}],"exported_at":"2026-08-09T16:41:55+00:00"},"state":{"root":"nimble-pine-0740","nodes":[{"slug":"nimble-pine-0740","title":"cadex \u2014 state","created_at":"2026-08-09T15:07:27+00:00","parents":[],"content":"Cadex is an AI-native CAD application: you describe the part, the AI authors a declarative **xscript** Python program, the program runs in a sandboxed headless worker, and only validated geometry reaches your model. The script *is* the model.\n\nOne product built from two forks in one repository, separated by a process boundary rather than a repository boundary: the **engine** at the root (a FreeCAD fork, running as `cadexd` over NDJSON) and the **shell** under `shell/` (a Blender fork carrying the `mesh_agent` add-on, which ships the engine inside its own bundle). A third protocol client, `cli/`, has no display at all. **Dynamics and control are built in**: a mechanism falls, collides, is actuated, exports as MJCF with exact OCCT inertias, and plays back a policy trained offboard on MuJoCo.\n\nRead `docs/VISION.md` before designing anything; `AGENTS.md` for the repo map, commands and change policy; `docs/DECISIONS.md` for why anything is the way it is.\n\nAdopted the Hypergraph protocol on 2026-08-09 (mode B \u2014 no legacy graph existed). Record nodes created before the epoch marker `winter-rain-7897` are prehistory: fourteen era and workstream summaries distilled from the repository and an author interview, not an event-by-event reconstruction.\n\n## Reconciliation\n\n- high_water_mark: quiet-wing-7912\n- reconciled_at: 2026-08-09T16:05:00+00:00\n","is_root":true,"status":null,"frontier":false,"layer":0,"order":0,"seq":0,"prov_count":0,"last_record_at":null,"impact_count":0},{"slug":"forest-wind-0342","title":"The engine \u2014 cadexd and the xscript pipeline","created_at":"2026-08-09T15:21:41+00:00","parents":["nimble-pine-0740"],"content":"Status: working\n\n## Current\n\nThe engine is a FreeCAD fork at the repository root, stripped to one AI-native modelling engine. A release build produces `FreeCADCmd` and `CadexGeometryWorker` and **no application** [rec: simple-hollow-8675].\n\n- It runs as **cadexd**: one headless `FreeCADCmd` child per open project, speaking `cadex-cadexd-v1` NDJSON over stdio, with serial dispatch, a `CADEXD_BUSY` refusal for a second modelling request, mid-run cancel, and a digest-verified restore pass on every open [rec: simple-hollow-8675].\n- **One project script is the sole source of truth.** Five domains \u2014 partdesign, sketcher, part, mesh, assembly \u2014 execute in one sandboxed `--safe-mode` worker that produces detached BREP, publishes into an ephemeral document under a single transaction with an ownership lint and orphan GC, and accepts a content digest [rec: civic-horizon-2730].\n- **Rebuild-digest equality is the load-bearing property**, and it is asserted on every `open_project` rather than once per audit: delete the document, re-run the script, digests match [rec: civic-horizon-2730].\n- The process boundary is pinned by tests, not by convention: `OP_ARG_SPECS` pins requests, ADR-027 goldens pin responses, and `test_engine_purity_guardrails.py` asserts cadexd's transitive import closure equals a declared list [rec: simple-hollow-8675].\n- Parameter changes are served two ways: a resident read-only preview worker answers a **pose-only** change in 33 ms, and everything else pays the ~0.42 s accepting path [rec: open-dew-7293].\n- The engine suite is **1,698 passed / 22 skipped**, measured 2026-08-09, headless and needing no build (`pixi run test-engine`); the skips are MJX-gated by design [rec: even-cliff-3863] [rec: sage-wood-0687].\n- The engine carries VibeCAD-era code under its own provenance tags, and the licence boundary that follows from it is one-way and hard: the engine side is LGPL, `shell/` is GPL [rec: lone-haven-0640].\n\n**Gap, unbuilt.** The ADR-027 response fixtures are asserted **engine-side only**. Asserting the same fixtures from the shell side is a ROADMAP Phase 9 item that has never been checked off, and it is more valuable since the merge, not less: one repository removed the distance that used to enforce the boundary [rec: simple-hollow-8675] [rec: merry-eagle-4093].\n\n## Negative knowledge\n\n- [scope: mesh domain outputs | confidence: high | evidence: civic-horizon-2730] Kernel output ordering is not a contract. FreeCAD's native mesh set operations return run-dependent orderings and triangulations, so a mesh output is not digest-stable without canonical vertex/facet reordering plus a vertex-set fingerprint.\n- [scope: the 33 ms preview worker | confidence: high | evidence: open-dew-7293] The preview cannot serve a parameter that changes a definition \u2014 a placement-only reply for part.box(p.width, ...) would be a lie. The 33 ms headline applies to a subset of sliders only; the rest pay the ~0.42 s accepting path.\n- [scope: kernel version pins | confidence: high | evidence: sage-wood-0687, civic-horizon-2730] Neither kernel may float. Reproducibility is asserted on every open, so occt and mujoco are exactly pinned; an unpinned update silently changes what a saved script means.\n\n## Provenance\n\n- lone-haven-0640 \u2014 the engine's origin as a FreeCAD fork and the VibeCAD-era code it still carries\n- civic-horizon-2730 \u2014 one project script, the removal protocol, and rebuild-digest equality\n- simple-hollow-8675 \u2014 cadexd, the NDJSON protocol, and the test-pinned process boundary\n- open-dew-7293 \u2014 the preview/accept split and the latency numbers\n- sage-wood-0687 \u2014 the deferred-import discipline and the MJX-gated skips\n- even-cliff-3863 \u2014 the measured suite count that replaced the stale documented one\n- merry-eagle-4093 \u2014 why the shell-side fixture gap got more valuable after the merge\n","is_root":false,"status":"working","frontier":false,"layer":1,"order":0,"seq":1,"prov_count":7,"last_record_at":"2026-08-09T15:27:26+00:00","impact_count":2},{"slug":"clear-banner-8342","title":"The wiring and electronic-assembly surface","created_at":"2026-08-09T15:22:27+00:00","parents":["forest-wind-0342"],"content":"Status: working\n\n## Current\n\nProcedural wire routing and the electronic-assembly surface, marked **experimental** in `docs/ARCHITECTURE.md` and carrying stated limits rather than hidden ones [rec: crisp-glacier-6395].\n\n- Six pure-Python, FreeCAD-free, kernel-neutral modules, staged into the sandboxed worker **by filename** rather than imported: routing (`part.cable`), multi-conductor bundles, geometry-anchored terminals, solder joints, a declared connection table (`nets`) and a declared board table (`boards`). All of it is unit-testable headless [rec: crisp-glacier-6395].\n- **None of it cost a protocol change.** `part.*` and `assembly.*` are the xscript surface, not the op table \u2014 the standing reason this much capability cost so little contract [rec: crisp-glacier-6395].\n- The Wiring editor is Blender's **stock node editor re-registered for exactly one Python tree type**, which is also the clearest example of the project removing something in the teardown and bringing it back later for a different purpose [rec: crisp-glacier-6395] [rec: civic-horizon-2730].\n- The solder joint is one **solid of revolution** \u2014 a closed outline, one face, one `revolve`, no boolean at all \u2014 which deleted every kernel hazard its predecessor documented: nine OCC calls per joint down to three, eight joints from 54 ms to 20.9 ms [rec: crisp-glacier-6395].\n- `wcv8.cadex` is the worked example: 22 conductors across seven routes [rec: crisp-glacier-6395].\n\nThe live list of stated limits is the off-phase section of `docs/ROADMAP.md` \u2014 several are deferred by decision (a bundle as an editable graph concept, mesh hole detection, colouring solder differently from wire) and at least one is a known defect left unfixed because fixing it moves accepted digests [rec: crisp-glacier-6395].\n\n## Negative knowledge\n\n- [scope: tests over published registries | confidence: high | evidence: crisp-glacier-6395] A fixture that disagrees with its producer hides the defect it was written to catch: the published registry dropped the two fields the endpoint join is made of and every wire vanished from the canvas while the suite stayed green. Drive the real producer.\n- [scope: shell-to-engine applies | confidence: high | evidence: crisp-glacier-6395] Starting a lifecycle and not polling it makes every apply after the first fail STALE_PROGRAM_REVISION silently. Twenty wires dragged built one cable, and the next refresh wiped the other nineteen off the canvas.\n- [scope: mesh obstacles in routing | confidence: medium | evidence: crisp-glacier-6395] Mesh obstacles are bounding boxes, so a component cannot avoid itself as a mesh \u2014 its own pad is inside its own box and the wire is refused at its own port. Pass such a body as a part solid instead, where the import converts at all.\n\n## Provenance\n\n- crisp-glacier-6395 \u2014 the whole workstream, its modules, its worked example and the three defects real use found\n- civic-horizon-2730 \u2014 the teardown that removed the node editor this surface brought back\n","is_root":false,"status":"working","frontier":false,"layer":2,"order":0,"seq":2,"prov_count":2,"last_record_at":"2026-08-09T15:16:12+00:00","impact_count":0},{"slug":"shy-crane-2573","title":"The shell \u2014 the Blender fork and mesh_agent","created_at":"2026-08-09T15:21:41+00:00","parents":["nimble-pine-0740"],"content":"Status: working\n\n## Current\n\nThe shell is a Blender fork under `shell/` carrying the `mesh_agent` add-on. It is the application a user launches, and it ships the engine inside its own bundle, discovered through a `cadex-engine.json` manifest so a built application needs no configuration [rec: simple-hollow-8675] [rec: merry-eagle-4093].\n\n- It is a **protocol client and nothing else**. It may not import anything from `src/`; `cadexd_client.py` is deliberately a plain GPL NDJSON client with no cadex imports. Being in one repository does not relax this [rec: simple-hollow-8675] [rec: merry-eagle-4093].\n- Product surface: viewport, chat, parameter sliders, model tree and script view; Cadex File and Edit menus; a saved-layout startup file rather than a Python template [rec: open-dew-7293]. Plus the Wiring editor [rec: crisp-glacier-6395], the Environment/Policy/Training/Live editors and the force-arrow overlay [rec: mellow-hawk-8610], and `render_views` and the section-cage overlay [rec: solemn-chart-6274].\n- **The diff rule that governs every change here**: every line of our `shell/` diff is under `shell/scripts/addons_core/mesh_agent/` or `shell/tests/python/`, and the inherited Blender tree is untouched. `docs/BLENDER-TREE.md` \u00a72a is eight files and must stay eight [rec: open-key-6334].\n- Nothing in `shell/` imports mujoco, and a test asserts it. The shell never learns MuJoCo exists \u2014 a policy rollout reaches it as the simulation trace it already knew how to play [rec: sage-wood-0687] [rec: open-key-6334].\n- The product gate is `pixi run gate`: one `CADEX-BLENDER-GATE` line against the built bundle, with picking \u2265 0.99 and slider median \u2264 0.65 s [rec: simple-hollow-8675] [rec: merry-eagle-4093].\n\n## Negative knowledge\n\n- [scope: shell/ edits outside mesh_agent | confidence: high | evidence: open-key-6334] Every line added to the inherited Blender tree is a future merge conflict. Adding one is a decision to bring back, not a fix to slip in \u2014 the empty-diff rule was retired but the boundary it stood proxy for was not, and BLENDER-TREE.md section 2a must stay eight files.\n- [scope: gate coverage | confidence: high | evidence: solemn-chart-6274] The gate runs blender --background, so anything needing a real VIEW_3D is not covered by it. Verify those by driving the built application and say so, rather than implying coverage the gate does not have.\n\n## Provenance\n\n- simple-hollow-8675 \u2014 the shell became the product when the Qt shell was deleted; it is a protocol client and nothing more\n- merry-eagle-4093 \u2014 the shell moved into this repository and the engine ships inside its bundle\n- open-dew-7293 \u2014 the menus, the editor types and the saved-layout startup file\n- crisp-glacier-6395 \u2014 the Wiring editor\n- mellow-hawk-8610 \u2014 the Live editor and the force-arrow overlay\n- solemn-chart-6274 \u2014 render_views and the section-cage overlay\n- open-key-6334 \u2014 the diff rule that replaced the empty-diff rule\n- sage-wood-0687 \u2014 nothing in shell/ imports mujoco, and a test asserts it\n","is_root":false,"status":"working","frontier":false,"layer":1,"order":1,"seq":3,"prov_count":8,"last_record_at":"2026-08-09T15:16:12+00:00","impact_count":1},{"slug":"simple-willow-8989","title":"File lifecycle \u2014 open, save, Save-As, and .blend vs .cadex","created_at":"2026-08-09T15:22:02+00:00","parents":["shy-crane-2573"],"content":"Status: broken\n\n## Current\n\nThe file-handling path inherited from Blender \u2014 opening, saving, Save-As, creating a new file, how the `.cadex` project directory relates to the `.blend` that displays it, and how the menus come up. **The author names this as one of the two most fragile parts of the product** [rec: western-badger-3023].\n\nTwo failures are measured rather than suspected:\n\n- **Nothing hydrates when a file is opened.** `load_post` reaches `on_file_changed`, which drops the previous file's sessions and returns early when the `.cadex` directory already exists; nothing queues a rebuild. A `.blend` opened beside its project therefore shows an **empty viewport** \u2014 `model_objects_on_open = 0`, measured in the shipped bundle \u2014 until an agent tool call, a slider drag or Rebuild Model provokes the first request [rec: western-badger-3023].\n- **A digest-moving engine change locks a project out of the UI with no visible way back in**, and the failure is at *open*, not at the next edit. `ensure_open` runs the restore pass, `CADEXD_RESTORE_FAILED` comes back, and every operation that would fix it is behind the same call. Rebuild Model correctly refuses. The operation that **is** the remedy is `write_script`, which already re-accepts on success \u2014 what is missing is a button that reaches it in this state [rec: western-badger-3023].\n\n**Recovery today is by hand**: `open_project restore=false`, then `write_script`. Until a fix lands, every digest-moving change ships with a manual recovery \u2014 and digest-moving changes are routine here, because a retained artifact's bytes are part of the project's identity [rec: western-badger-3023] [rec: crisp-glacier-6395].\n\nThe fix is known and is a `shell/` diff, which makes it a decision rather than something to slip in: cache the failure code from the last open on the per-root state, and let the chat panel draw the re-accept box it already draws for an orphaned project [rec: western-badger-3023].\n\n## Negative knowledge\n\n- [scope: opening a .blend beside its .cadex | confidence: high | evidence: western-badger-3023] Do not assume a file open hydrates the model. Nothing queues a rebuild on the file-open path, so the viewport is empty until a tool call, a slider drag or Rebuild Model provokes the first request.\n- [scope: digest-moving engine changes | confidence: high | evidence: western-badger-3023] Rebuild Model cannot recover a project locked out by a digest change, and it is correct to refuse. The remedy is open_project restore=false then write_script, and no button reaches it \u2014 every digest-moving change ships with a manual recovery until that lands.\n\n## Provenance\n\n- western-badger-3023 \u2014 the author names this as one of the two most fragile areas, and the two measured failures behind that\n- crisp-glacier-6395 \u2014 why digest-moving changes are routine here rather than rare\n","is_root":false,"status":"broken","frontier":true,"layer":2,"order":1,"seq":4,"prov_count":2,"last_record_at":"2026-08-09T15:18:43+00:00","impact_count":0},{"slug":"chilly-union-8972","title":"The headless CLI","created_at":"2026-08-09T15:22:02+00:00","parents":["nimble-pine-0740"],"content":"Status: working\n\n## Current\n\n`cli/` plus the `./cadex` shim is a second **front end** and the third client of the cadexd protocol: no Blender, no display, no shell code. It needs a built engine and nothing else [rec: jolly-walrus-3692].\n\n- Four subcommands \u2014 `-p`, `params`, `script`, `export` \u2014 of which exactly one spends tokens. The point is a cost asymmetry: one expensive turn authors a *parametric* script, and a cheap loop then sweeps its parameters with no model in the loop at all [rec: jolly-walrus-3692].\n- Its whole model-facing tool surface is **generated from `OP_ARG_SPECS`**, so it cannot drift from the contract it drives [rec: jolly-walrus-3692].\n- It cost **no engine change and no protocol change**, which is the evidence it was built to produce: a third client that had needed the contract widened would have been evidence against the contract [rec: jolly-walrus-3692] [rec: simple-hollow-8675].\n- `cli/` is **LGPL and `shell/` is GPL**, and the boundary is one-way and hard. Copying a line of the shell's client into `cli/` relicenses the engine side; derive from the engine-side precedents instead [rec: jolly-walrus-3692] [rec: lone-haven-0640].\n- Verified end to end on Linux, in CI, against both a build tree and a staged payload. **Never run on macOS by hand** [rec: jolly-walrus-3692].\n\n## Negative knowledge\n\n- [scope: cli/ on macOS | confidence: medium | evidence: jolly-walrus-3692] Nothing in the CLI is macOS-hostile, but it has never been run there by hand and 'should work' is not evidence. Expect the macOS CI job to be the thing that finds anything.\n- [scope: copying code into cli/ | confidence: high | evidence: jolly-walrus-3692] Copying a line from the GPL shell's client into LGPL cli/ relicenses the engine side. It is not a judgement call \u2014 derive from the engine-side precedents instead.\n\n## Provenance\n\n- jolly-walrus-3692 \u2014 the CLI's whole design, its verified scope and its stated gaps\n- simple-hollow-8675 \u2014 the protocol it is the third client of\n- lone-haven-0640 \u2014 the LGPL/GPL boundary it sits on the engine side of\n","is_root":false,"status":"working","frontier":false,"layer":1,"order":2,"seq":5,"prov_count":3,"last_record_at":"2026-08-09T15:16:12+00:00","impact_count":0},{"slug":"salty-isle-4063","title":"Dynamics and control on MuJoCo","created_at":"2026-08-09T15:22:03+00:00","parents":["nimble-pine-0740"],"content":"Status: working\n\n## Current\n\nDynamics and control is ordinary product surface on the one branch, not a vertical on a fork [rec: open-key-6334]. It is operations on the existing `assembly` domain \u2014 **no sixth domain, no protocol op, no output type of its own** \u2014 which is why the whole arc cost so little contract [rec: sage-wood-0687].\n\n- The arc runs end to end: `assembly.dynamics` simulates a solved assembly with exact OCCT inertias, `assembly.mjcf` exports one self-contained file that loads in a stock MuJoCo and verifies its own output before returning it, `assembly.task` states a control problem as data, `assembly.policy` verifies returned weights against a recorded witness, and `assembly.rollout` plays it back in the viewport [rec: sage-wood-0687].\n- **Live mode**: a running mechanism the user can push with the mouse, at **344 \u00b5s a control step (29\u00d7 real time)** and a 1.72 ms median round trip against a 33 ms bar, identical from the staged payload. `endless` plus `record_steps=False` makes a half-hour session cost +1.6 MB instead of +553 MB [rec: mellow-hawk-8610].\n- MuJoCo is a **kernel we keep, not a tree we fork** \u2014 upstream, unmodified, and `mujoco == 3.10.0` exactly pinned, arriving as a pypi wheel carried by name because the conda manifest is not re-solvable against the `occt` pin [rec: sage-wood-0687].\n- **Three invariants, all test-pinned and all cheap to break by accident**: nothing in `shell/` imports mujoco; `CadexDynamics.py` is reachable from the sandboxed worker and **never** from `cadexd`; and no `jax` or `mjx` anywhere under `src/Mod/cadex` or in a staged payload [rec: sage-wood-0687].\n- Two observation kinds were added by the RL work and cost one table row each: `centre_of_mass_velocity` and `centroidal_angular_momentum` [rec: humble-path-4466].\n- MJX and stock MuJoCo are the same physics to float64 machine epsilon with collision disabled and with a `plane` floor. They differ **only about box against box** \u2014 which is what `export_mjcf` writes for every grounded body [rec: humble-path-4466].\n\n**These are the newest and least settled surfaces in the product.** The author rates the training and demonstration panels as \"not fully fleshed out \u2014 most of what you need, but not quite\" [rec: western-badger-3023].\n\n## Negative knowledge\n\n- [scope: CadexDynamics imports | confidence: high | evidence: sage-wood-0687] mujoco and scipy.spatial must stay deferred imports inside functions. A service whose job is reading NDJSON off a pipe does not need 53.5 MB of physics engine resident, and test_engine_purity_guardrails asserts cadexd's import closure exactly.\n- [scope: MuJoCo defaults | confidence: high | evidence: sage-wood-0687] A default is a promise, not a decision. Every MuJoCo option the translator depends on is set explicitly and re-asserted on the compiled model; moving one is a measurement, not an edit.\n- [scope: trajectory comparison on a contacting biped | confidence: high | evidence: humble-path-4466] Trajectory-level agreement between MJX and stock MuJoCo can never be had \u2014 a 1e-7 nudge inside stock MuJoCo alone separates the trajectory just as fast. The two are comparable statistically and in no other way.\n\n## Provenance\n\n- sage-wood-0687 \u2014 the whole M0-M8 arc, the dependency and the three invariants\n- open-key-6334 \u2014 why it is product surface on one branch rather than a vertical on a fork\n- mellow-hawk-8610 \u2014 live mode and its measured numbers\n- humble-path-4466 \u2014 the two observation kinds and the MJX/MuJoCo comparison\n- western-badger-3023 \u2014 the author's own rating of how settled these surfaces are\n","is_root":false,"status":"working","frontier":false,"layer":1,"order":3,"seq":6,"prov_count":5,"last_record_at":"2026-08-09T15:18:43+00:00","impact_count":0},{"slug":"late-pond-2851","title":"The RL training loop and mg-legs","created_at":"2026-08-09T15:22:27+00:00","parents":["salty-isle-4063"],"content":"Status: blocked\n\n## Current\n\nBlocked on the **GPU training box**, which runs its own checkout of `training/cadex_train.py` that predates ADR-104. Dispatching the next run (B7) would silently ignore two new draws while recording the new algorithm string in the policy header, so the run is blocked rather than skipped. The CPU sanity run is green: 50 iterations, \u03c3 0.3006, witness 4.07e-08 [rec: western-badger-3023].\n\nWhat works, and is not in doubt:\n\n- **Training is offboard by design.** `training/` is the one top-level directory that is not part of the product: CMake never installs it, no payload carries it, nothing in it enters `pixi.toml`, and it cannot import Cadex. The engine **verifies** a policy and never **produces** one, which is what keeps it free of an optimiser, an accelerator and even numpy [rec: jolly-walrus-3692] [rec: sage-wood-0687].\n- The loop is: author the mechanism in an ordinary xscript project \u2192 export MJCF \u2192 declare the task \u2192 train on the GPU box \u2192 verify the returned weights against their witness \u2192 roll out locally over twelve seeds. Every step but the last is cheap, which is why a feasibility gate runs before GPU time is bought [rec: humble-path-4466].\n- **`mg-legs` is the standing benchmark**: a pelvis and two legs built from MG90S servos. Run **B6** is the first policy in the project's history to step *and* survive \u2014 checkpoint 2400 scores 6/12, where every prior run scored zero at every checkpoint [rec: humble-path-4466].\n- Selection is by **stepping-and-surviving, not by reward**, for the third measured time [rec: humble-path-4466].\n\n**Still open**: half the episodes at the declared shove band end `tipped`, and backward is the worst direction. B7 is the run that would spend the tenth observation kind \u2014 and it is the run the stale checkout blocks [rec: humble-path-4466] [rec: western-badger-3023].\n\n## Negative knowledge\n\n- [scope: reading a trainer reward curve | confidence: high | evidence: humble-path-4466] Trainer reward is not survival, and selecting a checkpoint by reward has lost to selecting by measured behaviour three separate times. Select by stepping-and-surviving.\n- [scope: looping evaluators | confidence: high | evidence: humble-path-4466] evaluate_episode multiplies domain randomisation into the model in place and never restores it, so any evaluator that reuses one model across a table drifts its own masses and inertias every episode. Build a fresh model per episode; both engine call sites already do.\n- [scope: azimuth and facing direction | confidence: high | evidence: humble-path-4466] azimuth_degrees is about world +X and the engine has no concept of which way a mechanism faces. mg-legs faces +Y, so an entire investigation had its forward and lateral columns swapped. Measure the forward axis off the model rather than assuming it.\n- [scope: reward figures recorded before ADR-101 | confidence: high | evidence: humble-path-4466] Every reward figure recorded before the never-ending-episode fix is non-comparable, because it was measured against an unbounded episode. Survival numbers are unaffected.\n\n## Provenance\n\n- western-badger-3023 \u2014 the blocker: the GPU box runs its own checkout predating ADR-104\n- jolly-walrus-3692 \u2014 training/ is offboard by design, with its own pinned venv\n- humble-path-4466 \u2014 the mg-legs arc, B6, and how a policy is selected\n- sage-wood-0687 \u2014 why the engine verifies a policy and never produces one\n","is_root":false,"status":"blocked","frontier":true,"layer":2,"order":2,"seq":7,"prov_count":4,"last_record_at":"2026-08-09T15:18:43+00:00","impact_count":0},{"slug":"idle-lantern-9094","title":"Organic modelling and the CAD/mesh interface","created_at":"2026-08-09T15:22:27+00:00","parents":["nimble-pine-0740"],"content":"Status: working\n\n## Current\n\nMaking the shapes a person actually asks for \u2014 a body, a limb, a skin over a mechanism \u2014 buildable by the agent and shapeable by the user without a chat turn [rec: solemn-chart-6274].\n\n- **The section cage is the answer to `docs/VISION.md`'s longest-standing open question.** Interactive mesh editing arrives as **engine ops on a declared table**: a shape is a `cage(...)` of superellipse rings the script declares, `part.loft_cage` builds and `set_params(cages=[\u2026])` sets. The shell draws the rings as an edge-only overlay and supplies only the **gesture** \u2014 drag a ring, press Apply. Nothing is authored outside the script, the mesh domain gained no editing surface, and no new space type was spent [rec: solemn-chart-6274].\n- Blends survive: `part.fillet` bisects a failing edge set and reports what it found; `fuse(blend=\u2026)` names the seam edges because it made them. The wolf welds 25 of 48 seams at 8 mm in 25.04 s against a 13.61 s baseline [rec: solemn-chart-6274].\n- Mounts are a declared interface with a static interference check that refuses in cubic millimetres, and swept-volume clearance is held over a whole trace [rec: solemn-chart-6274].\n- Lofts now measure how far the surface escapes the sections they were built from and refuse past a quarter of their span \u2014 which is how a loft enclosing **4.5\u00d7 the volume** of a straight loft through its own identical sections was found at all [rec: solemn-chart-6274].\n- **The robot wolf (`~/arch/woof.cadex`) is the standing benchmark**, with a per-slice log in `docs/ORGANIC.md` \u00a74. Those project files are live: copy to a scratch directory before building or probing [rec: solemn-chart-6274].\n\n**The standing direction behind this vertical** is that the agent uses every paradigm at its disposal and the user is never asked which one they are in. That is an explicit goal of the author's, approached one step at a time; an earlier attempt to unify the mesh and constraint systems wholesale did not land [rec: kind-ledge-5493].\n\n**O4 (subD) is parked and unscheduled by decision** \u2014 and because the cage has been used in anger, what it still cannot do is known and is *not* subdivision: a **curved spine** (the wolf's neck and tail stayed hand-written) and **closing an end**. Both come first [rec: solemn-chart-6274].\n\n## Negative knowledge\n\n- [scope: an earlier mesh/constraint unification attempt | confidence: low | evidence: kind-ledge-5493] The author recalls trying to unify the two paradigms wholesale, possibly on a throwaway branch, and it did not land as a system. No commit range is identified and this is memory only \u2014 do not treat it as a bounded prior attempt.\n- [scope: the section cage | confidence: high | evidence: solemn-chart-6274] The cage is straight and open-ended. It cannot express a curved spine or close an end, which is why the wolf's neck and tail stayed hand-written. Neither limitation is subdivision, so O4 would not fix them.\n- [scope: building against ~/arch projects | confidence: high | evidence: solemn-chart-6274] The benchmark projects under ~/arch are live files. Copy to a scratch directory before building or probing, drive rebuilds through the test_project_rebuild driver rather than hand-editing script.py, and back the script up first \u2014 a refused write_script silently restores the last accepted one.\n\n## Provenance\n\n- solemn-chart-6274 \u2014 the whole O0-O3b arc, the wolf benchmark and what O4 is parked behind\n- kind-ledge-5493 \u2014 the standing one-paradigm goal and the earlier unification attempt that did not land\n","is_root":false,"status":"working","frontier":false,"layer":1,"order":4,"seq":8,"prov_count":2,"last_record_at":"2026-08-09T15:16:13+00:00","impact_count":0},{"slug":"early-arbor-7123","title":"Orientation, build and the working environment","created_at":"2026-08-09T15:22:46+00:00","parents":["nimble-pine-0740"],"content":"Status: working\n\n## Current\n\n**Read this before touching anything.** The author's answer to \"what would waste a fresh agent's whole day\" was immediate and was not about code: **not knowing which stack a thing is in** \u2014 C++ versus Python, the Blender shell versus the FreeCAD engine versus Blender's own engine, what `pixi` covers, **what needs a build versus what needs an install**, and what runs on this machine versus the remote GPU box [rec: western-badger-3023].\n\n- **Two toolchains that must not see each other.** The engine builds inside the pixi/conda-forge environment; the shell builds against `shell/lib/<platform>` with Xcode and a homebrew `cmake`/`ninja`. Both supply zlib, libpng, OpenSSL and Python at different versions. `package/app/build_app.sh` scrubs pixi and conda off `PATH` and unsets ~50 conda variables before invoking cmake on `shell/` \u2014 which is why `build-shell` is a script and not a `cmd = [\"cmake\", \u2026]` task. Do not route the shell build around it [rec: merry-eagle-4093].\n- **The whole build is `pixi run setup && pixi run app`**, measured at ~21 minutes end to end on a fresh clone with a warm ccache [rec: merry-eagle-4093].\n- **What needs a build**: Python-only changes under `src/Mod/cadex/` need `pixi run build-engine` before the shell's suites see them, and `pixi run stage-engine` before the *bundled* engine does. A source tree that passes proves nothing about a payload [rec: merry-eagle-4093] [rec: simple-hollow-8675].\n- **`AGENTS.md` is the single agent contract**; `CLAUDE.md` holds one line, `@AGENTS.md`, and nothing else. Adding content to `CLAUDE.md` is the violation \u2014 it would recreate the split ADR-005 closed [rec: quiet-wing-7912].\n- **`docs/DECISIONS.md` is the project's primary memory** \u2014 115 of 248 commits, 136 ADRs. Almost all of the code was written by agents, and the ADR discipline is what has kept that coherent [rec: slender-basin-4979].\n- **ADR numbering is not contiguous.** 054 was deliberately never written, 069\u2013072 and 111 are absent, and 060\u2013067 plus 074 were renumbered when `MJC` merged. Cite an ADR by number **and** title [rec: slender-basin-4979] [rec: open-key-6334].\n- **One branch.** The `MJC` ref still exists, pointing at the merge; nothing should be committed to it [rec: open-key-6334].\n- **Related repositories, and what they are not.** `~/cdx-rl` and `~/cdx-mjc` are independent spin-off projects that *use* Cadex and occasionally open a wishlist pull request here; they are not part of this repository's concerns. `~/arch` is not a project at all \u2014 it is where the author's `.blend` and `.cadex` files live, and they are **live files**: copy before building or probing [rec: western-badger-3023].\n- **Where code and doc disagree, the code wins** \u2014 and the doc is fixed in the same PR with its `Verified against source:` date bumped [rec: slender-basin-4979].\n\n## Negative knowledge\n\n- [scope: building the shell | confidence: high | evidence: merry-eagle-4093] Never route the shell build around package/app/build_app.sh. Conda on PATH during a shell configure silently resolves the wrong zlib, libpng, OpenSSL and Python, and fails at link time or misbehaves at runtime.\n- [scope: verifying engine changes | confidence: high | evidence: simple-hollow-8675, merry-eagle-4093] A green source tree proves nothing about a payload. Anything touching the protocol or the payload must run the packaged gate with CADEX_ENGINE_ROOT pointed at a staged payload.\n- [scope: citing ADRs | confidence: high | evidence: slender-basin-4979, open-key-6334] ADR numbering is not contiguous \u2014 054 was deliberately never written, 069-072 and 111 are absent, and 060-067 plus 074 were renumbered on the MJC merge. Cite by number and title.\n- [scope: ctest | confidence: high | evidence: merry-eagle-4093] The inherited FreeCAD ctest has roughly 160 pre-existing environmental failures. Diff against build/ctest_baseline_failures.txt; never expect 100%.\n\n- [scope: figures restated in summary docs | confidence: high | evidence: even-cliff-3863] A number restated in a summary doc has no owner and drifts silently \u2014 the engine suite count sat at 1,105 in CLAUDE.md while the ADR log tracked it to 1,698. The ADR log and the command are the live sources; treat an undated figure in a summary doc as unverified.\n\n## Provenance\n\n- western-badger-3023 \u2014 the author's own answer to what wastes a fresh agent's day, and what the related repositories are\n- merry-eagle-4093 \u2014 the two toolchains, the scrubbing build script and the measured build time\n- slender-basin-4979 \u2014 the ADR log as primary memory, and the doc conventions\n- even-cliff-3863 \u2014 measured evidence that summary docs drift while the ADR log does not\n- quiet-wing-7912 \u2014 the contract's move to AGENTS.md and the pointer left behind\n- open-key-6334 \u2014 one branch, and the ADR renumbering\n- simple-hollow-8675 \u2014 why a passing source tree proves nothing about a payload\n","is_root":false,"status":"working","frontier":false,"layer":1,"order":5,"seq":9,"prov_count":7,"last_record_at":"2026-08-09T15:35:35+00:00","impact_count":2},{"slug":"round-glacier-2865","title":"Inherited-tree reduction, and the unscheduled replacements","created_at":"2026-08-09T15:22:46+00:00","parents":["nimble-pine-0740"],"content":"Status: open\n\n## Current\n\nThe standing work of shrinking both inherited trees in place, under the two-commit removal protocol: dependency audit \u2192 a **disable commit** \u2192 a **delete commit** \u2192 a `docs/DECISIONS.md` entry, each step independently verified against the same gates [rec: civic-horizon-2730].\n\nDone: 17 unused FreeCAD workbench trees, the Qt shell and the provider stack, the local bpy modes, and the dead publication paths [rec: civic-horizon-2730] [rec: simple-hollow-8675].\n\nOutstanding:\n\n- **Phase 8 \u2014 delete `src/Gui`** (66 MB, 729 files). `BUILD_GUI=OFF` was its disable commit and it landed long ago; the delete commit has not [rec: kind-ledge-5493] [rec: simple-hollow-8675]. One import makes it more than mechanical: `cadex_assembly_worker.py` reaches GUI-lineage code headlessly for exploded views [rec: kind-ledge-5493].\n- **Phase 13b, shell side**: the disable commit is nearly free there because the candidates are already CMake options \u2014 Cycles, the VSE, grease pencil, the compositor, `shell/locale/`, most of `shell/tests/files/` [rec: merry-eagle-4093].\n- **Phase 13b, engine side**: trees that build but are in no shipped payload, and a staged payload that is ~2.3 GB of which ~2.1 GB is development environment [rec: merry-eagle-4093].\n\n**Phases 11 and 12 \u2014 replacing the engine and the shell with our own \u2014 are unscheduled by decision, not stalled.** Merging the repositories removed the deadline pressure and turned them into optional internal swaps behind the unchanged protocol; the test-pinned protocol is exactly what keeps them available. **Do not start writing a replacement engine or shell in this tree ahead of its phase** [rec: merry-eagle-4093] [rec: western-badger-3023].\n\n## Negative knowledge\n\n- [scope: writing a replacement engine or shell | confidence: high | evidence: merry-eagle-4093, western-badger-3023] Do not start writing a replacement engine or shell in this tree ahead of its phase. Phases 11 and 12 are unscheduled by decision; what keeps them available is the test-pinned protocol, not partial work in the tree.\n- [scope: deleting src/Gui | confidence: high | evidence: kind-ledge-5493] The deletion is not mechanical: cadex_assembly_worker.py imports GUI-lineage code and uses it headlessly for exploded views. That import must be resolved in Phase 8, not deferred to Phase 11.\n\n## Provenance\n\n- civic-horizon-2730 \u2014 the two-commit removal protocol and Phase 1\n- simple-hollow-8675 \u2014 BUILD_GUI=OFF as the disable commit for src/Gui\n- kind-ledge-5493 \u2014 the outstanding delete commit and the one import that makes it non-mechanical\n- merry-eagle-4093 \u2014 why Phases 11 and 12 left the critical path, and what 13b covers on both sides\n- western-badger-3023 \u2014 that the replacements are unscheduled by decision rather than stalled\n","is_root":false,"status":"open","frontier":true,"layer":1,"order":6,"seq":10,"prov_count":5,"last_record_at":"2026-08-09T15:18:43+00:00","impact_count":0}],"exported_at":"2026-08-09T16:41:55+00:00"},"links":[{"record":"even-cliff-3863","state":"forest-wind-0342","kind":"impact","label":"new claim: the engine suite is 1,698 passed / 22 skipped, measured 2026-08-09, replacing the 1,105/12 figure"},{"record":"even-cliff-3863","state":"early-arbor-7123","kind":"impact","label":"new negative knowledge: figures restated in summary docs drift silently; the ADR log is the live source"},{"record":"quiet-wing-7912","state":"early-arbor-7123","kind":"impact","label":"new claim: AGENTS.md is the single agent contract and CLAUDE.md only imports it; adding content to CLAUDE.md is the violation"},{"record":"ancient-current-9419","state":"forest-wind-0342","kind":"impact","label":"The engine gains linked parts (ADR-138): a new `link_part` MODELING_OP pulls one accepted solid out of another project's pinned accepted attempt as a `.cxpart` container (pure file reading \u2014 no FreeCAD, no worker, no OCCT call, and the source project never opens), and `part.import_part` reads it back as the exact OCCT solid. New engine module `CadexLinkedPart.py`, in both DECLARED_ENGINE_MODULES and the project worker bundle. Part domain is 50 -> 51 operations. Refresh is the same call again; `changed` says whether the source moved. No new output type, no new artifact_kind, no change to compute_project_digest. Suite count 1,698 -> 1,723 passed / 22 skipped. Answers the parked open question of how projects compose: one flat script each, joined by content-addressed files, not sub-scripts or imports."},{"record":"ancient-current-9419","state":"shy-crane-2573","kind":"impact","label":"The shell gains File > Link Part... and File > Refresh Linked Parts, a `lin // FNV-1a hash of a slug -> [0,1). Deterministic jitter source so the force

function hashSlug(s) {

// ---------------------------------------------------------------- quadtree
// Barnes-Hut. The pairwise repulsion loop is the only thing on this page that
// scales badly: at 500 nodes it is 240 ticks x 125,000 pairs = 30 million
// distance computations before the first paint. A quadtree collapses every
// distant clump of nodes into one body, which turns the tick from O(n^2) into
// O(n log n) and leaves the near field — the part that actually shapes the
// drawing — computed exactly.
//
// Deterministic, like everything else here: the tree is built in a fixed order
// and walked with an explicit stack, so the same input gives the same forces.

const QT_THETA = 0.9;      // cell size / distance below this: treat as one body
const QT_MAX_DEPTH = 20;   // coincident points would subdivide forever otherwise

function qtCell(x, y, size) {
  return { x, y, size, mass: 0, sx: 0, sy: 0, cx: 0, cy: 0,
           slug: null, px: 0, py: 0, kids: null };
}

function qtPlace(c, slug, x, y, depth) {
  const h = c.size / 2;
  const i = (x >= c.x + h ? 1 : 0) + (y >= c.y + h ? 2 : 0);
  const kid = c.kids[i] ||
    (c.kids[i] = qtCell(c.x + ((i & 1) ? h : 0), c.y + ((i & 2) ? h : 0), h));
  qtInsert(kid, slug, x, y, depth + 1);
}

function qtInsert(c, slug, x, y, depth) {
  c.mass += 1; c.sx += x; c.sy += y;
  c.cx = c.sx / c.mass; c.cy = c.sy / c.mass;
  if (c.mass === 1) { c.slug = slug; c.px = x; c.py = y; return; }
  if (depth >= QT_MAX_DEPTH) return;   // give up subdividing; the cell lumps them
  if (!c.kids) {
    c.kids = [null, null, null, null];
    if (c.slug !== null) { qtPlace(c, c.slug, c.px, c.py, depth); c.slug = null; }
  }
  qtPlace(c, slug, x, y, depth);
}

function quadtree(slugs, pos) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const s of slugs) {
    const p = pos[s];
    if (!p) continue;
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  if (!isFinite(minX)) return null;
  const size = Math.max(maxX - minX, maxY - minY, 1) * 1.05;
  const root = qtCell(minX, minY, size);
  for (const s of slugs) if (pos[s]) qtInsert(root, s, pos[s].x, pos[s].y, 0);
  return root;
}

// Repulsion on one node, accumulated into `f`. Same law as the exact loop —
// min(cap, strength / d^2) — so tuning carries over unchanged; a lumped cell
// simply contributes its own mass times that.
function qtRepulsion(root, slug, x, y, strength, cap, f) {
  if (!root) return;
  const stack = [root];
  while (stack.length) {
    const c = stack.pop();
    if (!c || !c.mass) continue;
    const single = c.kids === null && c.mass === 1;
    if (single && c.slug === slug) continue;
    let dx = x - c.cx, dy = y - c.cy, d2 = dx * dx + dy * dy;
    if (d2 < 1e-4) {  // coincident: deterministic symmetry break, as before
      const ang = hashSlug(slug + (c.slug || "cell")) * 6.283185307;
      dx = Math.cos(ang); dy = Math.sin(ang); d2 = 1;
    }
    if (!single && c.kids && c.size * c.size >= QT_THETA * QT_THETA * d2) {
      for (let i = 0; i < 4; i++) if (c.kids[i]) stack.push(c.kids[i]);
      continue;
    }
    const d = Math.sqrt(d2);
    const rep = Math.min(cap, strength / d2) * (single ? 1 : c.mass);
    f.x += (dx / d) * rep;
    f.y += (dy / d) * rep;
  }
}

// ------------------------------------------------------------ spatial hash
// A uniform grid over the same points. Cheaper than a tree when the query is
// "what is near this box?" rather than "what is the aggregate force here?" —
// which is what card de-overlap and blob avoidance both ask.
function gridHash(items, cellSize) {
  const buckets = new Map();
  const key = (i, j) => i + "," + j;
  items.forEach(it => {
    const i0 = Math.floor(it.minX / cellSize), i1 = Math.floor(it.maxX / cellSize);
    const j0 = Math.floor(it.minY / cellSize), j1 = Math.floor(it.maxY / cellSize);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const k = key(i, j);
      const bucket = buckets.get(k);
      if (bucket) bucket.push(it); else buckets.set(k, [it]);
    }
  });
  return {
    cellSize,
    near(minX, minY, maxX, maxY) {
      const out = new Set();
      const i0 = Math.floor(minX / cellSize), i1 = Math.floor(maxX / cellSize);
      const j0 = Math.floor(minY / cellSize), j1 = Math.floor(maxY / cellSize);
      for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
        const bucket = buckets.get(key(i, j));
        if (bucket) bucket.forEach(it => out.add(it));
      }
      return out;
    },
  };
}

// ---------------------------------------------------------------- timeline
// The record graph is a timeline with a few concurrent threads, not a DAG to be
// ranked: on this repo it is 29 layers deep and 3 wide, which a layered layout
// renders as a 1:15 ribbon. Here time runs along x and `git log` lanes stack
// along y, so the same 39 nodes read as a wide strip at full size.
//
// Lanes come from the payload (hypergraph.py: lane_layout), so they are computed
// once, deterministically, from the real parent relation.

const MIN_STEP = Math.round(RANK_STEP * 0.35);   // "time" mode: idle gaps compress
const MAX_STEP = RANK_STEP * 3;                  // …and busy days still separate

function recordChrono() {
  return DATA.record.nodes.slice().sort((a, b) => a.chrono - b.chrono);
}

// x per record node. "rank" gives every node the same slice of width; "time"
// spaces them by real elapsed time with both ends clamped, so a three-week idle
// gap does not push the next month off screen and a busy hour is still legible.
function timelineX(nodes) {
  const x = {};
  if (show.xaxis === "rank") {
    nodes.forEach(n => x[n.slug] = n.chrono * RANK_STEP);
    return x;
  }
  const ms = nodes.map(n => Date.parse(n.created_at || "") || 0);
  const gaps = [];
  for (let i = 1; i < ms.length; i++) gaps.push(Math.max(0, ms[i] - ms[i - 1]));
  const sorted = gaps.slice().sort((a, b) => a - b);
  const median = sorted.length ? sorted[sorted.length >> 1] : 0;
  const perMs = RANK_STEP / Math.max(1, median);   // median gap ≈ one rank step
  let at = 0;
  nodes.forEach((n, i) => {
    if (i) at += Math.min(MAX_STEP, Math.max(MIN_STEP, (ms[i] - ms[i - 1]) * perMs));
    x[n.slug] = Math.round(at);
  });
  return x;
}

function layoutTimeline(pos) {
  const nodes = recordChrono();
  const x = timelineX(nodes);
  nodes.forEach(n => pos[n.slug] = { x: x[n.slug], y: n.lane * LANE_H });
  if (stVis()) {  // state visible alongside: a plain column past the strip
    const right = Math.max(0, ...nodes.map(n => x[n.slug])) + CW / 2 + 120 + NW / 2;
    DATA.state.nodes.forEach(n => pos[n.slug] = { x: right, y: n.seq * (NH + 22) });
  }
  return pos;
}

// Furniture drawn behind the chips: lane rules, a date gutter, and the
// high-water mark. Everything is derived from `pos`, so dragging a chip does not
// invalidate it.
function timelineFurniture(pos) {
  const nodes = recordChrono().filter(n => pos[n.slug]);
  if (!nodes.length) return null;
  const xs = nodes.map(n => pos[n.slug].x);
  const x0 = Math.min(...xs) - CW / 2 - 24, x1 = Math.max(...xs) + CW / 2 + 24;
  const laneCount = Math.max(...nodes.map(n => n.lane)) + 1;

  const ticks = [];           // one label per new calendar day, at its first node
  let lastDay = null;
  nodes.forEach(n => {
    const day = (n.created_at || "").slice(0, 10);
    if (!day || day === lastDay) return;
    lastDay = day;
    ticks.push({ x: pos[n.slug].x, day, label: day.slice(5) });
  });

  // A single vertical rule reads as "everything to the right is unreconciled". That
  // only holds for a linear record graph; once a merge gives it several tips, no one
  // x-position separates the two sets, so the rule is suppressed and the per-node
  // "unreconciled" accent carries the information on its own. The exporter sets
  // high_water_mark to null whenever the frontier has more than one tip.
  const hwm = DATA.reconciliation.high_water_mark;
  const hwmX = hwm && pos[hwm] ? pos[hwm].x + CW / 2 + 8 : null;
  return { x0, x1, laneCount, ticks, hwmX,
           top: -LANE_H, bottom: (laneCount - 1) * LANE_H + LANE_H };
}

// ------------------------------------------------------------------- board
// The state graph is a status board, not a graph. Twelve nodes at depth 2 drawn
// as a tree is a flat bar in an empty screen — and it is the view that carries
// the frontier, which is the first thing an arriving reader needs.
//
// Columns run broken | blocked | open | working | superseded: the three frontier
// statuses first, because "what is broken or waiting" outranks "what is fine".
// An empty column is kept and labelled 0 — "nothing is broken" is a real answer.

const BOARD_COLUMNS = ["broken", "blocked", "open", "working", "superseded"];
// Positions are card *centres*, so the first row must clear the header band.
const BOARD_HEAD = 0;                    // header text baseline
const BOARD_TOP = BH / 2 + 18;           // first card's centre
const TREE_INDENT = 34;
// An empty column collapses to a rail instead of vanishing. "Nothing is broken"
// still gets said, and the five statuses stop costing 1290px of width when only
// two of them hold anything.
const RAIL_W = 52, RAIL_GAP = 12;

function boardCards() {
  return DATA.state.nodes.filter(n => !n.is_root);
}
function boardRoot() {
  return DATA.state.nodes.find(n => n.is_root) || null;
}

// Freshest first inside a column: `last_record_at` is the newest record node
// cited as this claim's provenance, so the column reads newest work downward.
function boardColumnOrder(a, b) {
  const at = a.last_record_at || "", bt = b.last_record_at || "";
  if (at !== bt) return at < bt ? 1 : -1;
  return a.seq - b.seq;
}

function boardGroups() {
  const groups = {};
  BOARD_COLUMNS.forEach(s => groups[s] = []);
  boardCards().forEach(n => (groups[n.status] || (groups[n.status] = [])).push(n));
  BOARD_COLUMNS.forEach(s => groups[s].sort(boardColumnOrder));
  return groups;
}

// Column geometry: x and width per status, wide when populated, a rail when not.
function boardColumns() {
  const groups = boardGroups();
  let x = 0;
  return BOARD_COLUMNS.map(status => {
    const count = groups[status].length;
    const w = count ? BW : RAIL_W;
    const col = { status, count, nodes: groups[status], x, w, rail: !count };
    x += w + (count ? BCOL - BW : RAIL_GAP);
    return col;
  });
}

function layoutBoard(pos) {
  const root = boardRoot();
  if (show.board === "tree") {
    // Mirrors STATE.md's Architecture section: pre-order DFS (`seq`) with the
    // graph depth (`layer`) as indentation.
    DATA.state.nodes.forEach(n => pos[n.slug] = {
      x: n.layer * TREE_INDENT + BW / 2,
      y: n.seq * (BH + 10),
    });
  } else {
    const cols = boardColumns();
    cols.forEach(col => col.nodes.forEach((n, row) => pos[n.slug] = {
      x: col.x + BW / 2,
      y: BOARD_TOP + row * BROW,
    }));
    const last = cols[cols.length - 1];
    if (root) pos[root.slug] = {   // the root is a caption, not a column item
      x: (cols[0].x + last.x + last.w) / 2,
      y: BOARD_HEAD - 26 - BH / 2,
    };
  }
  if (recVis()) {  // record visible alongside: a chronological column to the left
    const left = -BCOL - NW / 2 - 40;
    recordChrono().forEach(n => pos[n.slug] = { x: left, y: n.chrono * (NH + 16) });
  }
  return pos;
}

// Column headers, drawn only in status mode. Counts come from the same grouping
// the layout used, so a header can never disagree with its column.
function boardFurniture() {
  if (show.board !== "status") return null;
  const columns = boardColumns();
  const rows = Math.max(1, ...columns.map(c => c.count));
  return { columns, headerY: BOARD_HEAD,
           height: BOARD_TOP + (rows - 1) * BROW + BH / 2 + 14 };
}

// x offset of the state column in the layered two-column arrangement; also
// anchors the column header texts.
function comboStateX() { return show.style === "cards" ? NW + 430 : 300; }

// Order for the state column: the mean chronological position of the record
// work each claim rests on. This is the barycentre sweep `layered_layout` runs
// within one graph, applied *across* the two — a claim built from early work
// sits beside early work, which is the cheapest way to cut crossings without
// hiding a single link.
//
// Claims with no provenance keep their architecture order, pinned to the top so
// the state root stays where a reader expects it.
function stateColumnOrder() {
  const chrono = {};
  DATA.record.nodes.forEach(n => chrono[n.slug] = n.chrono);
  const acc = {};
  DATA.links.forEach(l => {
    if (chrono[l.record] == null) return;
    (acc[l.state] = acc[l.state] || []).push(chrono[l.record]);
  });
  const bary = n => {
    if (n.is_root) return -2;           // the root is an anchor, not a claim
    const xs = acc[n.slug];
    if (!xs || !xs.length) return -1;   // unlinked: keep it above the rest
    return xs.reduce((a, b) => a + b, 0) / xs.length;
  };
  return DATA.state.nodes.slice()
    .sort((a, b) => bary(a) - bary(b) || a.seq - b.seq);
}

// The record graph outgrows the screen long before it outgrows the format: at 500
// nodes the timeline is 87,000px wide. A window keeps the most recent N by
// chronological rank and drops the rest from the layout entirely, so the world
// shrinks rather than merely being scrolled past.
function windowedOut(pos) {
  const keep = WINDOWS[show.window];
  if (!isFinite(keep)) return;
  const cutoff = DATA.record.nodes.length - keep;
  if (cutoff <= 0) return;
  DATA.record.nodes.forEach(n => { if (n.chrono < cutoff) delete pos[n.slug]; });
}

// A collapsed hyperedge is replaced by one puck at the centre of its members.
// A member cited by another, still-expanded claim stays visible — it belongs to
// that one too, and hiding it would misreport the other blob.
function collapseOut(pos) {
  if (!collapsed.size) return;
  const H = hyperedges();
  collapsed.forEach(state => {
    const h = H.index[state];
    if (!h) return;
    let x = 0, y = 0, n = 0;
    h.members.forEach(m => { const p = pos[m]; if (p) { x += p.x; y += p.y; n++; } });
    if (!n) return;
    pos[puckKey(state)] = { x: x / n, y: y / n };
  });
  collapsed.forEach(state => {
    const h = H.index[state];
    if (!h) return;
    h.members.forEach(m => {
      const owners = H.memberOf[m] || [];
      if (owners.every(st => collapsed.has(st))) delete pos[m];
    });
  });
}

function computeLayout() {
  const pos = finishLayout(rawLayout());
  return pos;
}

function finishLayout(pos) {
  windowedOut(pos);
  collapseOut(pos);
  return pos;
}

function rawLayout() {
  const pos = {};
  const cards = show.style === "cards";
  if (show.layout === "timeline") {
    return layoutTimeline(pos);
  } else if (show.layout === "board") {
    return layoutBoard(pos);
  } else if (show.layout === "layered") {
    if (show.graphs === "both") {  // two chronological columns
      const sx = comboStateX();
      const rStep = cards ? NH + 30 : 44, sStep = cards ? NH + 46 : 44;
      // The record column runs in real time order, so "further down" means
      // "later" and the state column's barycentre is measured against something
      // a reader can actually see.
      DATA.record.nodes.forEach(n => pos[n.slug] = { x: 0, y: n.chrono * rStep });
      stateColumnOrder().forEach((n, i) => pos[n.slug] = { x: sx, y: i * sStep });
    } else {                       // single graph: centered layer grid
      const g = show.graphs;
      const dx = cards ? NW + 70 : 76, dy = cards ? NH + 78 : 84;
      const perLayer = {};
      DATA[g].nodes.forEach(n => (perLayer[n.layer] = perLayer[n.layer] || []).push(n));
      DATA[g].nodes.forEach(n => {
        const width = perLayer[n.layer].length;
        pos[n.slug] = { x: (n.order - (width - 1) / 2) * dx, y: n.layer * dy };
      });
    }
  } else {                         // force: two-level cluster sim, deterministic
    layoutForce(pos);
    if (cards) {  // sim runs in circle metric; stretch, then separate any
      for (const s in pos) { pos[s].x *= 3.2; pos[s].y *= 1.8; }
      separateCards(pos);
    }
  }
  return pos;
}

// Push overlapping cards apart. This used to be 40 passes over every pair, which
// at 500 nodes is 5 million comparisons per pass. A card can only overlap another
// within one card's distance, so a uniform grid keyed on card size answers "which
// cards are near this one?" directly and the pass becomes linear in practice.
// Slug order stays the iteration order, so the result is unchanged in kind and
// still deterministic.
function separateCards(pos) {
  const slugs = Object.keys(pos);   // insertion order: deterministic
  const mw = NW + 24, mh = NH + 24;
  for (let pass = 0; pass < 40; pass++) {
    const grid = gridHash(slugs.map(s => ({
      slug: s, minX: pos[s].x - mw / 2, maxX: pos[s].x + mw / 2,
      minY: pos[s].y - mh / 2, maxY: pos[s].y + mh / 2,
    })), Math.max(mw, mh));
    let any = false;
    for (const slug of slugs) {
      const a = pos[slug];
      for (const other of grid.near(a.x - mw, a.y - mh, a.x + mw, a.y + mh)) {
        if (other.slug <= slug) continue;   // each pair once, in slug order
        const b = pos[other.slug];
        const ox = mw - Math.abs(a.x - b.x), oy = mh - Math.abs(a.y - b.y);
        if (ox <= 0 || oy <= 0) continue;   // cards clear of each other
        any = true;
        if (ox * mh < oy * mw) {            // push apart along the cheaper axis
          const s = (a.x <= b.x ? -1 : 1) * ox / 2;
          a.x += s; b.x -= s;
        } else {
          const s = (a.y <= b.y ? -1 : 1) * oy / 2;
          a.y += s; b.y -= s;
        }
      }
    }
    if (!any) break;
  }
}

// ------------------------------------------------------------------- force
// The Clusters view asks one question: which record work belongs to the same
// state claim? A single flat force sim answers it badly — every node repels
// every other equally, so twelve hyperedges settle into one overlapping pile and
// the blobs on top of them become mush.
//
// So the layout runs at two levels. First the *hyperedges* are laid out as a
// coarse graph of twelve bodies, each with a radius set by its member count,
// pushed apart until they no longer overlap and pulled together when they share
// members. Only then do nodes settle, each held near the centre of the
// hyperedge(s) it belongs to. Group separation is decided by the level that
// knows about groups, which is what makes it hold.

const CLUSTER_GAP = 34;        // clear space demanded between two hyperedges
const CLUSTER_TICKS = 260, NODE_TICKS = 240;
// Below this the exact pairwise loop is cheaper than building a tree per tick,
// and it stays as the reference the approximation is tested against.
const BH_MIN_NODES = 120;

// FNV-1a -> [0,1): the page's only source of jitter, and it is a pure
// function of the slug — so every load lays out identically.
function hashSlug(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h / 4294967296;
}

// Radius a hyperedge needs to hold its members without crowding them.
function clusterRadius(h) {
  return 40 + 26 * Math.sqrt(Math.max(1, h.members.length));
}

// Coarse layout over the hyperedges themselves. Seeded on a ring ordered by
// size (biggest first) so the result is reproducible and the large clusters,
// which have the least freedom, claim their space first.
function clusterCentres() {
  const list = hyperedges().list;
  if (!list.length) return {};
  const order = list.slice().sort((a, b) => b.members.length - a.members.length ||
                                            (a.state < b.state ? -1 : 1));
  const radius = {}, centre = {};
  order.forEach((h, i) => {
    radius[h.state] = clusterRadius(h);
    const angle = (i / order.length) * 6.283185307 + hashSlug(h.state) * 0.4;
    const ring = 60 + 46 * Math.sqrt(order.length) * (0.7 + 0.3 * (i / order.length));
    centre[h.state] = { x: Math.cos(angle) * ring, y: Math.sin(angle) * ring };
  });

  // Shared members pull two hyperedges together; overlap pushes them apart.
  const shared = [];
  for (let i = 0; i < order.length; i++) {
    const mi = new Set(order[i].members);
    for (let j = i + 1; j < order.length; j++) {
      const n = order[j].members.reduce((c, m) => c + (mi.has(m) ? 1 : 0), 0);
      if (n) shared.push([order[i].state, order[j].state, n]);
    }
  }

  for (let t = 0; t < CLUSTER_TICKS; t++) {
    const alpha = 1 - t / CLUSTER_TICKS;
    shared.forEach(([a, b, n]) => {
      const pa = centre[a], pb = centre[b];
      const dx = pb.x - pa.x, dy = pb.y - pa.y;
      const d = Math.hypot(dx, dy) || 1;
      const rest = radius[a] + radius[b] + CLUSTER_GAP;
      const pull = Math.min(0.06, 0.012 * n) * (d - rest) / d * alpha;
      pa.x += dx * pull; pa.y += dy * pull;
      pb.x -= dx * pull; pb.y -= dy * pull;
    });
    for (let i = 0; i < order.length; i++) {
      for (let j = i + 1; j < order.length; j++) {
        const a = order[i].state, b = order[j].state;
        const pa = centre[a], pb = centre[b];
        let dx = pb.x - pa.x, dy = pb.y - pa.y;
        let d = Math.hypot(dx, dy);
        if (d < 1e-3) {  // coincident: deterministic symmetry break
          const ang = hashSlug(a + b) * 6.283185307;
          dx = Math.cos(ang); dy = Math.sin(ang); d = 1;
        }
        const want = radius[a] + radius[b] + CLUSTER_GAP;
        if (d >= want) continue;
        const push = ((want - d) / d) * 0.5;
        pa.x -= dx * push; pa.y -= dy * push;
        pb.x += dx * push; pb.y += dy * push;
      }
    }
    order.forEach(h => {  // mild centering keeps the whole board near the origin
      centre[h.state].x *= 1 - 0.004 * alpha;
      centre[h.state].y *= 1 - 0.004 * alpha;
    });
  }
  return { centre, radius };
}

// Where a node wants to sit: the centre of its hyperedge, or the mean of them
// when it belongs to several — a node cited by two claims belongs between them.
function nodeHomes(centres) {
  const H = hyperedges(), homes = {};
  DATA.record.nodes.forEach(n => {
    const owners = (H.memberOf[n.slug] || []).filter(st => centres.centre[st]);
    if (!owners.length) return;
    let x = 0, y = 0;
    owners.forEach(st => { x += centres.centre[st].x; y += centres.centre[st].y; });
    homes[n.slug] = { x: x / owners.length, y: y / owners.length,
                      // a node shared by two clusters is held less tightly by
                      // either, so it can sit in the overlap rather than fight
                      weight: owners.length > 1 ? 0.10 : 0.22 };
  });
  return homes;
}

const REPULSION = 20000, REPULSION_CAP = 30;

function simTick(pos, nodes, springs, homes, alpha) {
  const f = {};
  nodes.forEach(s => f[s] = { x: 0, y: 0 });
  // Repulsion through a Barnes-Hut tree: exact near, lumped far. Below the
  // crossover the tree costs more than it saves, so small graphs keep the plain
  // pairwise loop — which is also the reference the tree is checked against.
  if (nodes.length >= BH_MIN_NODES) {
    const tree = quadtree(nodes, pos);
    nodes.forEach(s => qtRepulsion(tree, s, pos[s].x, pos[s].y,
                                   REPULSION, REPULSION_CAP, f[s]));
  } else {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = pos[nodes[i]], b = pos[nodes[j]];
        let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 < 1e-4) {  // coincident: deterministic symmetry break
          const ang = hashSlug(nodes[i] + nodes[j]) * 6.283185307;
          dx = Math.cos(ang); dy = Math.sin(ang); d2 = 1;
        }
        const d = Math.sqrt(d2), rep = Math.min(REPULSION_CAP, REPULSION / d2);
        const ux = dx / d, uy = dy / d;
        f[nodes[i]].x += ux * rep; f[nodes[i]].y += uy * rep;
        f[nodes[j]].x -= ux * rep; f[nodes[j]].y -= uy * rep;
      }
    }
  }
  springs.forEach(sp => {                           // [from, to, k, rest]
    const a = pos[sp[0]], b = pos[sp[1]];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const k = sp[2] * (d - sp[3]) / d;
    f[sp[0]].x += dx * k; f[sp[0]].y += dy * k;
    f[sp[1]].x -= dx * k; f[sp[1]].y -= dy * k;
  });
  nodes.forEach(s => {                              // home pull + integrate
    const home = homes[s];
    if (home) {
      f[s].x += (home.x - pos[s].x) * home.weight;
      f[s].y += (home.y - pos[s].y) * home.weight;
    } else {
      f[s].x -= pos[s].x * 0.005;
      f[s].y -= pos[s].y * 0.005;
    }
    pos[s].x += f[s].x * alpha;
    pos[s].y += f[s].y * alpha;
  });
}

// Springs come from graph *structure* (parent edges + cross-links), never from
// the edge display toggles, so the layout is stable under checkbox flips.
// Node iteration order is DATA array order (record then state): deterministic.
function runSim(pos, homes) {
  const nodes = [];
  const springs = [];
  // Parent edges pull only weakly here: in this view the grouping is the
  // message, and a strong causal chain would drag members out of their blob.
  const tree = g => DATA[g].nodes.forEach(n => {
    if (!pos[n.slug]) return;
    nodes.push(n.slug);
    n.parents.forEach(p => { if (pos[p]) springs.push([p, n.slug, 0.012, 120]); });
  });
  if (recVis()) tree("record");
  if (stVis()) tree("state");
  if (recVis() && stVis()) DATA.links.forEach(l => {
    if (pos[l.record] && pos[l.state])
      springs.push([l.record, l.state, 0.012, 170]);
  });
  let alpha = 1.0;
  for (let t = 0; t < NODE_TICKS; t++) {
    simTick(pos, nodes, springs, homes || {}, alpha);
    alpha *= 0.985;
  }
}

// Seed members on a ring inside their cluster, in a deterministic order, so the
// sim starts already grouped and only has to relax rather than to discover.
function seedClustered(pos, centres, homes) {
  const H = hyperedges();
  const seen = {};
  H.list.forEach(h => {
    const c = centres.centre[h.state];
    if (!c) return;
    const r = centres.radius[h.state] * 0.72, n = Math.max(1, h.members.length);
    h.members.forEach((m, i) => {
      if (seen[m] || !bySlug[m]) return;
      seen[m] = true;
      // Sunflower packing: even area coverage, so a big cluster stays compact
      // instead of stringing its members around one wide ring.
      const a = i * 2.399963229728653 + hashSlug(h.state) * 6.283185307;
      const rad = r * Math.sqrt((i + 0.5) / n);
      pos[m] = { x: c.x + Math.cos(a) * rad, y: c.y + Math.sin(a) * rad };
    });
  });
  let loose = 0;
  DATA.record.nodes.forEach(n => {   // nodes no claim ever cited, on the outside
    if (pos[n.slug] || !recVis()) return;
    const a = (loose++ / 8) * 6.283185307;
    const ring = 40 + 30 * Math.sqrt(DATA.record.nodes.length);
    pos[n.slug] = { x: Math.cos(a) * ring * 1.9, y: Math.sin(a) * ring * 1.9 };
  });
  if (stVis()) DATA.state.nodes.forEach(n => {  // a state node sits in its blob
    const c = centres.centre[n.slug];
    pos[n.slug] = c ? { x: c.x, y: c.y - centres.radius[n.slug] * 0.25 }
                    : { x: (hashSlug(n.slug) - 0.5) * 300, y: -420 };
    if (c) homes[n.slug] = { x: c.x, y: c.y, weight: 0.18 };
  });
}

function layoutForce(pos) {
  const centres = clusterCentres();
  if (!centres.centre) {   // no hyperedges: plain seeded sim
    let maxOrder = 0;
    if (recVis()) DATA.record.nodes.forEach(n => {
      maxOrder = Math.max(maxOrder, n.order);
      pos[n.slug] = { x: n.order * 80 + (hashSlug(n.slug) - 0.5) * 8,
                      y: n.layer * 80 + (hashSlug(n.slug + "y") - 0.5) * 8 };
    });
    if (stVis()) DATA.state.nodes.forEach(n => pos[n.slug] = {
      x: (maxOrder + 3) * 80 + n.order * 80 + (hashSlug(n.slug) - 0.5) * 8,
      y: n.layer * 80 + (hashSlug(n.slug + "y") - 0.5) * 8 });
    runSim(pos, {});
    return pos;
  }
  const homes = nodeHomes(centres);
  seedClustered(pos, centres, homes);
  if (!recVis()) for (const s in pos) if (bySlug[s].graph === "record") delete pos[s];
  runSim(pos, homes);
  return pos;
}

// ------------------------------------------------------------------- blobs
// Organic outlines around a set of nodes: the geometry behind a hyperedge.
//
// The signed-distance-field half of this file is ported from the excaligraph
// project (src/geometry/blob.ts, MIT licence) and condensed for the browser.
// The algorithm, its parameter names and its commentary are that project's; the
// bugs in the transcription are ours. No URL here on purpose — this page must
// stay self-contained, and a test asserts it fetches nothing.
//
// A hyperedge joins many nodes at once, so an arrow will not do — we fill a blob
// that contains every member. A convex hull will not do either: the hull of
// three far-apart nodes swallows everything between them, member or not. So:
//
//   1. every member contributes its own signed distance, pushed out by `padding`;
//   2. a band of half-width `corridor` runs along a minimum spanning tree of the
//      member centres, so far-apart members stay one connected blob;
//   3. the pieces join with a *smooth* minimum, so two close members bulge into
//      one body instead of showing a seam;
//   4. every non-member is subtracted, so the boundary bends around a node that
//      happens to sit in the way.
//
// Then the zero contour comes out by marching squares, gets simplified, and is
// drawn as a closed curve. It is plain arithmetic on a fixed grid: same input,
// same points, every time — which is the rule this page is held to anyway.

// Tuned for this page's scale (nodes are 32px circles or ~160-240px cards).
const BLOB = { padding: 15, corridor: 10, smoothing: 18, clearance: 11,
               resolution: 5, tolerance: 1.4, maxPoints: 220 };
const BLOB_MAX_SAMPLES = 60000;   // per blob; coarsen rather than stall
// Total grid samples one render may spend across *all* blobs. 12 blobs still get
// the full 60k each; 59 blobs get 12k each and coarsen instead of taking seven
// seconds. Sampling was 98% of the first paint at 500 nodes.
const BLOB_SAMPLE_BUDGET = 720000;
// A tile of the sampling grid. Everything further than its own influence radius
// from a tile cannot change the field inside it, so each tile samples a pruned
// set — see traceContour.
const BLOB_TILE = 24;
// Below this zoom the field's detail is invisible anyway, so the cheap hull is
// the honest choice; it is also what a drag uses, to keep the frame rate.
const BLOB_FIELD_MIN_ZOOM = 0.3;

// ------------------------------------------------------- fast fallback: hull
// Andrew's monotone chain; deterministic sort. Colinear inputs collapse to
// the two extreme points (capsule fallback in blobPath).
function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const half = seq => {
    const out = [];
    for (const pt of seq) {
      while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], pt) <= 0)
        out.pop();
      out.push(pt);
    }
    out.pop();
    return out;
  };
  return half(p).concat(half(p.slice().reverse()));
}

// A member contributes its whole box to the hull, so the outline wraps chips,
// cards and circles alike — the shape depends on the layout, not on one toggle.
function memberOutline(slug, pos) {
  const p = pos[slug];
  if (!p) return [];
  if (styleFor(bySlug[slug]) === "circle") return [p];
  const d = dimsOf(slug);
  return [{ x: p.x - d.w / 2, y: p.y - d.h / 2 }, { x: p.x + d.w / 2, y: p.y - d.h / 2 },
          { x: p.x - d.w / 2, y: p.y + d.h / 2 }, { x: p.x + d.w / 2, y: p.y + d.h / 2 }];
}

function blobPath(members, pos) {
  const circles = show.style === "circles";
  const RB = circles ? R + BPAD : BPAD;
  const pts = members.flatMap(s => memberOutline(s, pos));
  if (!pts.length) return null;
  if (pts.length === 1) {
    const p = pts[0];
    return `M ${p.x - RB} ${p.y} a ${RB} ${RB} 0 1 0 ${2 * RB} 0` +
           ` a ${RB} ${RB} 0 1 0 ${-2 * RB} 0 Z`;
  }
  const hull = convexHull(pts);
  if (hull.length < 3) {  // 2 members, or all colinear: capsule
    const a = hull[0], b = hull[hull.length - 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = -dy / d * RB, ny = dx / d * RB;
    return `M ${a.x + nx} ${a.y + ny}` +
           ` A ${RB} ${RB} 0 0 1 ${a.x - nx} ${a.y - ny}` +
           ` L ${b.x - nx} ${b.y - ny}` +
           ` A ${RB} ${RB} 0 0 1 ${b.x + nx} ${b.y + ny} Z`;
  }
  let cx = 0, cy = 0;
  hull.forEach(p => { cx += p.x; cy += p.y; });
  cx /= hull.length; cy /= hull.length;
  const ex = hull.map(p => {  // pad: push vertices out radially from centroid
    const dx = p.x - cx, dy = p.y - cy;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: p.x + dx / d * RB, y: p.y + dy / d * RB };
  });
  return closedCurve(ex.map(p => [p.x, p.y]));
}

// Closed Catmull-Rom through the loop, as cubic Beziers.
function closedCurve(loop) {
  const n = loop.length;
  if (n < 3) return null;
  let d = `M ${loop[0][0]} ${loop[0][1]}`;
  for (let i = 0; i < n; i++) {
    const p0 = loop[(i + n - 1) % n], p1 = loop[i];
    const p2 = loop[(i + 1) % n], p3 = loop[(i + 2) % n];
    d += ` C ${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6},` +
         ` ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6},` +
         ` ${p2[0]} ${p2[1]}`;
  }
  return d + " Z";
}

// ------------------------------------------------- signed distance functions
// Each returns 0 on the outline, negative inside and positive outside, in px.
// Subtracting a constant grows the shape by that much and rounds its corners,
// which is exactly what `padding` should do.
function sdRectangle(px, py, b) {
  const dx = Math.abs(px - (b.x + b.width / 2)) - b.width / 2;
  const dy = Math.abs(py - (b.y + b.height / 2)) - b.height / 2;
  return Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) + Math.min(Math.max(dx, dy), 0);
}

// Exact for a circle. For a stretched ellipse it reads a little short along the
// long axis, which errs toward a tighter blob, never a looser one.
function sdEllipse(px, py, b) {
  const hw = Math.max(b.width / 2, 1e-6), hh = Math.max(b.height / 2, 1e-6);
  const norm = Math.hypot((px - (b.x + hw)) / hw, (py - (b.y + hh)) / hh);
  return (norm - 1) * Math.min(hw, hh);
}

function sdShape(s, px, py) {
  return s.shape === "ellipse" ? sdEllipse(px, py, s.box) : sdRectangle(px, py, s.box);
}

// Distance to a line segment. The corridor band is this, minus its half-width.
function sdSegment(px, py, a, b) {
  const vx = b[0] - a[0], vy = b[1] - a[1];
  const wx = px - a[0], wy = py - a[1];
  const len2 = vx * vx + vy * vy;
  const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, (wx * vx + wy * vy) / len2));
  return Math.hypot(wx - vx * t, wy - vy * t);
}

// A minimum that rounds off the corner where two shapes meet, so their union
// reads as one body. `k` is the width of the blend, in px.
function smoothMin(a, b, k) {
  if (k <= 0) return Math.min(a, b);
  const h = Math.max(0, Math.min(1, 0.5 + (0.5 * (b - a)) / k));
  return b * (1 - h) + a * h - k * h * (1 - h);
}
function smoothMax(a, b, k) { return -smoothMin(-a, -b, k); }

// ------------------------------------------------------------------- corridors
// A minimum spanning tree over the member centres (Prim, O(n^2) in members).
// This is what keeps a blob in one piece: without it, two members further apart
// than the padding would each get their own island.
function spanningSegments(centres) {
  const segs = [];
  if (centres.length < 2) return segs;
  const reached = [0];
  const remaining = new Set(centres.map((_, i) => i).slice(1));
  while (remaining.size) {
