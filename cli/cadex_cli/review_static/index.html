<!DOCTYPE html>
<!-- SPDX-FileCopyrightText: 2026 Cadex Authors
     SPDX-License-Identifier: LGPL-2.1-or-later
     The project page, cut to what watching and steering a design needs
     (docs/DASHBOARD.md, ADR-533): the model, a design turn, the
     parameters and the revisions. At desk width a left rail sits beside
     the model; below 1000 px the model leads one column. Element ids are
     the hooks the CLI suite pins. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The server writes this launch's write token here; every POST carries it (ADR-503). -->
<meta name="cadex-write-token" content="">
<title>Cadex</title>
<link rel="stylesheet" href="review.css">
</head>
<body>
<header id="top">
  <div class="title">
    <a id="home" href="../../" title="All projects">Cadex</a>
    <h1 id="project-name">loading…</h1>
    <div id="accepted-line"></div>
  </div>
  <div id="freshness" data-state="loading">loading…</div>
</header>
<main id="frame">
  <section id="stage">
    <section id="model" class="region">
      <div id="model-status" data-state="empty">no model loaded</div>
      <div class="viewport"><canvas id="viewer" width="960" height="540"></canvas></div>
      <div class="controls viewer-controls"><button id="model-fit" type="button">Fit</button></div>
    </section>
  </section>
  <div id="left" class="rail">
    <section id="turn-panel" class="panel">
      <h2>Design turn</h2>
      <!-- Runs `cadex -p PROMPT --project …` (ADR-504); its stderr streams below. -->
      <textarea id="turn-prompt" rows="3" placeholder="What to build or change" aria-label="Prompt"></textarea>
      <div class="controls">
        <label class="toggle" for="turn-resume"><input type="checkbox" id="turn-resume" checked> <span>continue</span></label>
        <button id="turn-start" type="button">Start turn</button>
      </div>
      <div id="turn-status" data-state="idle"></div>
      <pre id="turn-transcript" hidden></pre>
    </section>
    <section id="params-panel" class="panel">
      <h2>Parameters</h2>
      <!-- A slider runs `cadex params --set NAME=VALUE --project …` (ADR-503). -->
      <div id="params-write" data-state="idle"></div>
      <table id="params"><tbody></tbody></table>
      <p id="params-empty" class="muted small" hidden>No parameters declared.</p>
    </section>
    <section id="revision-panel" class="panel">
      <h2>Revisions</h2>
      <!-- Runs `cadex revision accept|reject|restore … --project …` (ADR-506). -->
      <div class="controls">
        <button id="revision-accept" type="button" disabled>Accept</button>
        <button id="revision-reject" type="button" disabled>Reject</button>
      </div>
      <div id="revision-status" data-state="idle"></div>
      <ol id="revision-list" reversed></ol>
    </section>
  </div>
</main>
<script type="module" src="viewer.js"></script>
</body>
</html>
