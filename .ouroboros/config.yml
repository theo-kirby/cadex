run: ot5
goal: .ouroboros/goal.md
memory: auto            # -> hypergraph (config + CLI present)
backend: headless       # tmux: one streaming window per harness call in the run session
# Two roles. The critic is one read-only call after every actor turn: it grades the
# diff against the quality bar, answers as the sleeping user, refuses false "done",
# and writes the next prompt. The maintainer and planner are off: a due reconcile is
# the actor's next iteration (housekeeping), and the critic's reply names the next
# unit. ot4 paid for five calls an iteration and closed no criterion.
critic: agent           # rules: the deterministic fallback only, no model call
maintainer: false       # true: a separate maintainer call instead of actor housekeeping
planner: false          # true: a planner writes bets after each reconcile
idle_interval: 30m
roles:
  actor:
    harness: claude
    model: claude-opus-5
    timeout: 90m
    resume_for: 1
    fallback:
      - { harness: codex, model: gpt-6-astra }   # while Claude is out of usage; back to Claude when it resets
  critic:
    harness: codex        # a Codex critic on Claude work is a real second opinion
    model: gpt-6-astra
    timeout: 10m
    fallback:
      - { harness: claude, model: claude-opus-5 }
  maintainer:             # only called with maintainer: true
    harness: claude
    model: claude-opus-5
    timeout: 30m
    fallback:
      - { harness: codex, model: gpt-6-astra }
  planner:                # only called with planner: true
    harness: claude
    model: claude-opus-5
    timeout: 20m
    fallback:
      - { harness: codex, model: gpt-6-astra }
git:
  branch: null            # -> ouroboros/ot5
  tag_on_accept: true
  revert_on_reject: false # fix forward: the charter forbids reverting this run's own
                          # commits. A rejected commit stays, gets no ok tag, and the
                          # critic's fix is the top of the next actor prompt.
  allow_dirty: false
stop:
  after: 48h              # the only thing that ends this run
  max_iterations: null
  max_cost_usd: null      # subscriptions; nothing here is billed per call
  max_usage: null         # a window crossing a line must not end a two-day run: the
                          # window resets while the run is still going, and the loop
                          # waits it out by itself. `limits.reserve` blocks the harness
                          # instead, which is what leaves Claude for the operator.
  until: null
  on_done_accepted: null
  max_stuck: 25           # `stuck` is a loop that changed nothing; backoff makes 25 ~3.8h
handoff:
  recent: 3
hypergraph:
  reconcile_every: 5      # housekeeping is due after this many worked iterations...
  pressure: 3             # ...or at this many unreconciled record nodes
  budget_units: 1
limits:
  cooldown: 30m           # block a limited harness this long when it does not say when it resets; doubles
  max_cooldown: 3h
  transient_strikes: 3
  reserve:
    claude: 0.99          # this is the quarry account and the run may have all of it.
                          # Kept just under 1.0 so the loop steps aside a moment before
                          # the hard limit and falls back to Codex, instead of spending
                          # an actor turn discovering the wall.
loop:                     # motion without progress (ouroboros DESIGN.md section 6b)
  product_after: 8        # iterations changing only records, plans and STATE.md
  frontier_after: 30      # iterations with no node moving and no criterion ticked
  repeat_bet_after: 3     # only measured with the planner on
  escalate_every: 5
  rotate: true            # rung 3: hand the actor's turn to Codex for a while
                          # Nothing here stops the run.
plan:                     # only with planner: true
  every: 5
  view: plan
  md: PLAN.md
  max_new_directions: 1
