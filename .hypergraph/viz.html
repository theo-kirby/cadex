const DATA = {"project":"cadex","record":{"root":"odd-banner-6071","nodes":[{"slug":"odd-banner-6071","title":"cadex \u2014 record","created_at":"2026-08-09T15:07:26+00:00","parents":[],"content":"Append-only record graph root for cadex.\n\nEvery unit of work lands here as a node with a declared `## State Impact` (SPEC I1/I2).\n","is_root":true,"is_hwm":false,"unreconciled":false,"impacts":[],"impact_none":null,"layer":0,"order":0,"seq":0,"chrono":0,"lane":0},{"slug":"lone-haven-0640","title":"Prehistory: VibeCAD, and why Cadex left it","created_at":"2026-08-09T15:15:47+00:00","parents":["odd-banner-6071"],"content":"## What\n\nBefore this repository existed, the work happened inside **VibeCAD** \u2014 another\ndeveloper's project, a vendored fork of FreeCAD with an AI agent inside it:\n\"Cursor, but for CAD\". The author contributed to it, and then broke the work off\ninto a separate project rather than keep maintaining a personal fork. Cadex's\nfirst commit is 2026-07-23 (`b3b9abb7c41a`, \"Initial commit\"); everything above\nthat line is prehistory, carried in the author's memory and in the\n`[VibeCAD-era]` provenance tags that still label code in the tree.\n\n## Why\n\nIndependent workstream branched from the record root: this is the project's\norigin and has no causal parent inside the repository.\n\nVibeCAD worked, and is still under active development by its maintainer. The\nbreak was not dissatisfaction with it \u2014 it was that the author's north star had\nstopped being VibeCAD's, and continuing would have meant steering someone else's\nroadmap.\n\n## Method\n\nAuthor's account, given in the adoption interview (2026-08-09). Corroborated by\nwhat survives in the tree: `docs/PROVENANCE.md` credits VibeCAD;\n`docs/ARCHITECTURE.md` tags surviving modules `[VibeCAD-era]`\n(`CadexScriptedProcess.py`, `CadexScriptedPublication.py`,\n`cadex_{partdesign,sketcher,part,assembly}_{api,worker}.py`,\n`CadexGeometryWorker.cpp`); `docs/history/` keeps two superseded VibeCAD-era\ndesign documents; and ROADMAP Phase 13b records deleting `/Users/theo/vibecad`\n(5.9 GB) once its branch tip was pushed and verified.\n\n## Result\n\nThe north star that came out of the break, in the author's own framing: take\nFreeCAD's **parametric, constraint-based modelling engine** \u2014 plus everything\nVibeCAD taught about how an agent and a human drive the same tools together \u2014\nand inject it into **Blender's shell**. Blender has the modern UI and UX, the\nextensibility and the Python API; what it does not have is constraint-based\nmodelling, because its paradigm is mesh-native (vertices, edges, faces,\nsculpting, armature rigging). FreeCAD has the modelling and not the shell. Smush\nthem together, and put an agent on the whole thing.\n\nEvery structural decision in this repository is downstream of that sentence. In\nparticular it is why the two inherited trees are **forks to be reduced** rather\nthan dependencies: what we fork we intend to replace (FreeCAD's application\nlayer, Blender's shell), and what we keep we keep unmodified (OCCT, and later\nMuJoCo).\n\nWhat carried over from VibeCAD: the xscript idea (the agent authors a\ndeclarative Python program; the program *is* the model), the sandboxed-worker\npublication pipeline, and four of the five domain APIs. What did not: multi-engine\nscripting (build123d, OpenSCAD), the 18-domain surface, and eventually the whole\nof FreeCAD's UI.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW engine \u2014 the engine is a FreeCAD fork carrying VibeCAD-era pipeline code; provenance is a live licensing and design constraint, not trivia.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"engine","resolved":null,"delta":"the engine is a FreeCAD fork carrying VibeCAD-era pipeline code; provenance is a live licensing and design constraint, not trivia.","new":true}],"impact_none":null,"layer":1,"order":0,"seq":1,"chrono":1,"lane":0},{"slug":"slender-basin-4979","title":"Prehistory: the method \u2014 agent-aided development and the ADR log","created_at":"2026-08-09T15:16:12+00:00","parents":["odd-banner-6071"],"content":"## What\n\nHow this project is actually worked, which is not derivable from the code.\n`docs/DECISIONS.md` is the most-touched file in the repository by a wide margin \u2014\n**115 of 248 commits**, against 67 for `ROADMAP.md` and 45 for the busiest source\nfile \u2014 and it carries 136 ADRs written over 16 days.\n\n## Why\n\nIndependent workstream branched from the record root: it spans every era rather\nthan following one.\n\n## Method\n\nPer the author: **almost all of the code has been written by agents.** The ADR\nlog was decided on early and was less robust at the start than it became; it\ngrew into the project's primary memory. The change policy in `CLAUDE.md` requires\na `docs/DECISIONS.md` entry for every removal or direction change, verified by\nbuild and tests in the same PR, and treats removals as normal work rather than\nas exceptional.\n\nThe doc set carries the same discipline: each document has a\n`Verified against source:` date, provenance tags (`[FreeCAD-inherited]`,\n`[Blender-inherited]`, `[VibeCAD-era]`, `[Cadex-new]`), and keeps *exists today*\nseparate from *target*. `ROADMAP.md` holds living status; `DECISIONS.md` holds\nwhy; `VISION.md` is authoritative about intent.\n\n## Result\n\nThe ADR style is load-bearing rather than decorative, and it is why the docs are\nusable as evidence at all: an ADR states what was measured, what the plan got\nwrong, and what it cost. Several slices carry explicit \"two of this line's own\nwords were wrong\" paragraphs, and the roadmap keeps a *declined* item (ADR-054)\nwith its number and its measurement attached so it can be revived rather than\nre-argued.\n\nPractical cautions for anyone reading it:\n- **ADR numbering is not contiguous.** 054 was deliberately never written,\n  069\u2013072 and 111 are absent, and 060\u2013067 plus 074 were renumbered when `MJC`\n  merged. Cite by number **and** title.\n- **Where code and doc disagree, the code wins** \u2014 and the doc gets fixed in the\n  same PR, with its date bumped.\n- `docs/history/` is superseded VibeCAD-era material. Historical context only;\n  never cite it as current.\n\nThis hypergraph adoption **continues that discipline rather than replacing it**.\nThe ADR log stays the narrative record of decisions; the record graph is where\nunits of work land with a declared state impact, and the state graph is the\ndistilled projection an arriving agent reads first.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW orientation-and-build \u2014 `docs/DECISIONS.md` is the project's primary memory, ADR numbering is not contiguous, and the doc set has a defined reading order.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"orientation-and-build","resolved":null,"delta":"`docs/DECISIONS.md` is the project's primary memory, ADR numbering is not contiguous, and the doc set has a defined reading order.","new":true}],"impact_none":null,"layer":1,"order":1,"seq":2,"chrono":12,"lane":4},{"slug":"kind-ledge-5493","title":"Prehistory: what was tried and left little trace","created_at":"2026-08-09T15:16:13+00:00","parents":["odd-banner-6071"],"content":"## What\n\nThe dead ends and background experiments that never became ADRs, recorded\nbecause an adoption that imports only the documented history imports a\nflattering version of it.\n\n## Why\n\nIndependent workstream branched from the record root: it spans the project\nrather than following any one era.\n\n## Method\n\nAuthor's account in the adoption interview (2026-08-09), plus what the tree\ncorroborates. **These claims come from memory and are not independently\nverifiable in this repository** \u2014 some of the work may have happened on\nthrowaway branches that no longer exist. They are recorded at low confidence and\nmust be cited as such, never rounded up.\n\n## Result\n\n- **An attempt to unify the mesh-based and constraint-based systems.** The\n  author recalls trying this at some point, possibly on a throwaway branch, and\n  it did not land as a system. Some UX-level pieces of it may have survived into\n  the tree without attribution. No commit range is identified.\n- **A lot of ad-hoc comparison across the paradigms the app now contains**:\n  Blender's own simulation versus the assembly simulation versus MuJoCo's physics\n  constraints versus the RL training environment; constraint-based modelling\n  versus mesh-based modelling versus modifiers. Not written up anywhere.\n- **Why it keeps being tried**, which is the durable part: the intended end state\n  is that **the agent uses everything at its disposal and the user is never asked\n  which paradigm they are in** \u2014 not \"this bit is mesh-based, this bit is\n  constraint-based, that simulation came from somewhere else\". Getting there is\n  hard, so it is being approached one step at a time.\n\nTwo things that *did* land are exactly this pattern succeeding rather than\nfailing, which is the useful reading: `part.shape_from_mesh` feeds imported\nmeshes into the BREP domains (ADR-043), and the section cage arrived as **engine\nops on a declared table** rather than as mesh editing (ADR-127) \u2014 the shell\nsupplies the gesture and the script stays the only thing that authors geometry.\nThe prediction in `docs/VISION.md` that interactive mesh editing would have to\narrive as engine ops held exactly.\n\nThe largest removal, by contrast, is fully documented: FreeCAD's entire UI,\nreplaced by the Blender shell (ADR-021, ADR-022). Its delete commit \u2014 Phase 8,\n`src/Gui`, 66 MB, 729 files \u2014 is still pending.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW organic-modelling \u2014 one-paradigm-for-the-user is the standing direction behind this vertical; the earlier unification attempt is undocumented and low-confidence.\n- target: NEW inherited-tree-reduction \u2014 `src/Gui` is disabled but not deleted; Phase 8 is the outstanding delete commit.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"organic-modelling","resolved":null,"delta":"one-paradigm-for-the-user is the standing direction behind this vertical; the earlier unification attempt is undocumented and low-confidence.","new":true},{"target":"inherited-tree-reduction","resolved":null,"delta":"`src/Gui` is disabled but not deleted; Phase 8 is the outstanding delete commit.","new":true}],"impact_none":null,"layer":1,"order":2,"seq":3,"chrono":14,"lane":6},{"slug":"civic-horizon-2730","title":"Prehistory: the teardown \u2014 FreeCAD stripped to one engine","created_at":"2026-08-09T15:15:58+00:00","parents":["lone-haven-0640"],"content":"## What\n\nThe first two days of the repository: 29 commits, Phases 0\u20132 and 4 of\n`docs/ROADMAP.md`, ADR-001\u2026ADR-016. The documentation set was written **first**\n(`docs/VISION.md`, `ARCHITECTURE.md`, `ROADMAP.md`, `DECISIONS.md`); then 17\nunused FreeCAD workbench trees were deleted; then the per-domain multi-program\nsurface was replaced by **one project script**.\n\n## Why\n\nFollows the break from VibeCAD. Before anything could be built on the engine,\nthe engine had to be understood and reduced to what the product actually uses \u2014\nthe \"dig deep on how FreeCAD really works\" half of the north star.\n\n## Method\n\nThe removal protocol established here is still in force (`docs/FREECAD.md` \u00a73):\ndependency audit, a **disable commit** (drop the tree from\n`src/Mod/CMakeLists.txt`, verify build + launch + tests), then a **delete\ncommit** (verify again), then a `docs/DECISIONS.md` entry. Batch A was 13 trees\n(ADR-007); batch B was Draft, Points, TechDraw and Spreadsheet (ADR-009); a\ndead-code sweep inside `src/Mod/cadex` followed (ADR-010).\n\nPhase 2 then made one script the sole source of truth: `params`/`num` declared\nat the top of the script, one multi-domain worker, publication under a single\ntransaction with an ownership lint and orphan GC (ADR-011\u2026ADR-013), and sliders\nbound to `param_specs` and committing through `set_params` (ADR-014).\n\n## Result\n\nThe exit criterion was a testable property rather than a feeling: **delete the\ndocument, re-run the script, and the content digest matches**\n(`cadex_rebuild.py`, ctest `CadexProjectRebuildDigest`, rebuild-vs-accepted\n*and* rebuild-vs-rebuild). That property is still asserted on every\n`open_project` today, which is why restart determinism is proven continuously\nrather than once per audit.\n\nPhase 4 added the mesh domain on `Mod/Mesh` + `Mod/MeshPart` (ADR-016) and hit\nthe first real determinism hazard: FreeCAD's native mesh set operations return\nrun-dependent orderings and triangulations, so mesh outputs needed canonical\nvertex/facet reordering plus a vertex-set digest fingerprint before they were\ndigest-stable at all.\n\n`v0.0.1` was tagged on 2026-07-24, the only tag in the repository. Per the\nauthor it means nothing: versioning has been loose from the start and was never\nkept up. It is not an era boundary and should not be read as one.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW engine \u2014 one project script is the sole source of truth, and rebuild-digest equality is the engine's load-bearing property.\n- target: NEW inherited-tree-reduction \u2014 the two-commit removal protocol exists and Phase 1 is complete.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"engine","resolved":null,"delta":"one project script is the sole source of truth, and rebuild-digest equality is the engine's load-bearing property.","new":true},{"target":"inherited-tree-reduction","resolved":null,"delta":"the two-commit removal protocol exists and Phase 1 is complete.","new":true}],"impact_none":null,"layer":2,"order":0,"seq":4,"chrono":2,"lane":0},{"slug":"simple-hollow-8675","title":"Prehistory: the process boundary \u2014 cadexd, the Blender shell, and the Qt shell's deletion","created_at":"2026-08-09T15:15:58+00:00","parents":["civic-horizon-2730"],"content":"## What\n\nPhases 5, 6 and 7 in a single day \u2014 35 commits, ADR-017\u2026ADR-024. The engine\nbecame **cadexd**: a per-project headless `FreeCADCmd` service speaking\n`cadex-cadexd-v1` NDJSON over stdio. The Blender add-on `mesh_agent` became its\nclient and therefore the product. Then the interim Qt shell and the entire\nprovider stack were deleted.\n\n## Why\n\nFollows the teardown, and depended on it: a single script format plus a\ndigest-verified rebuild is what made the engine separable at all. Separating it\nis also what let the Blender shell be the product without dragging the engine\nacross the GPL boundary.\n\n## Method\n\n`cadexd.py` + `CadexdProtocol.py`: serial dispatch, a `CADEXD_BUSY` refusal for\na second modelling request, mid-run `cancel`, stdin-EOF lifetime, an fd-1 hijack\nso only protocol frames reach the parent, and a digest-verified restore pass on\nevery open (ADR-017). The Qt shell was deliberately made the *first* protocol\nclient \u2014 to prove the boundary \u2014 and then removed (ADR-018, ADR-021).\n`BUILD_GUI=OFF` for release and package configs (ADR-022), which doubles as the\ndisable commit for `src/Gui` under the removal protocol. The engine payload with\na `cadex-engine.json` discovery manifest landed here too (ADR-023).\n\n## Result\n\nMeasured, not asserted: picking fidelity **372/372** against a \u226599 % bar,\nslider-drag median **0.548 s** against a 0.65 s bar, restart rehydration, and\n`kill -9` \u2192 respawn \u2192 restore digest equality with a mid-run cancel.\n\nThe subtraction was large: 57 Python modules \u2192 34, 36 test files / 425 tests \u2192\n20 / 154, and `requirements.txt` deleted outright because the engine had no\nthird-party Python dependency left. A release build produces `FreeCADCmd` and\n`CadexGeometryWorker` **and no application**.\n\nThe boundary is a *process* boundary, and tests pin it rather than convention:\n`test_engine_purity_guardrails.py` asserts cadexd's transitive import closure\nequals a declared list, and that nothing under `src/Mod/cadex/**` imports\n`PySide*`, `FreeCADGui`, `tool_impl` or `jsonschema`. ADR-027 later pinned the\n*response* half of the protocol with golden fixtures, after finding that\n`OP_ARG_SPECS` pinned requests only while the shell read ~50 unasserted response\nkeys.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW engine \u2014 the engine runs as cadexd behind a test-pinned NDJSON protocol, with no GUI and no provider stack.\n- target: NEW shell \u2014 the Blender add-on `mesh_agent` is the product UI and the protocol's first real client.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"engine","resolved":null,"delta":"the engine runs as cadexd behind a test-pinned NDJSON protocol, with no GUI and no provider stack.","new":true},{"target":"shell","resolved":null,"delta":"the Blender add-on `mesh_agent` is the product UI and the protocol's first real client.","new":true}],"impact_none":null,"layer":3,"order":0,"seq":5,"chrono":5,"lane":0},{"slug":"merry-eagle-4093","title":"Prehistory: one repository \u2014 the shell moves in","created_at":"2026-08-09T15:15:58+00:00","parents":["simple-hollow-8675"],"content":"## What\n\nPhase 13a, pulled to the front of the roadmap (ADR-030). The Blender fork was\nimported under `shell/` as a squashed snapshot of the separate `mesh` repository\n@ `ac5af55948d`. `shell/` is now by far the largest directory in the tree \u2014\n96,020 files \u2014 and its birth date, **2026-07-25**, is the sharpest single signal\nin the repository's timeline.\n\n## Why\n\nFollows the cadexd split, and depended on it: the seam between the two\nrepositories was already a process boundary pinned on both requests and\nresponses, so merging them was a repo-layout and build-orchestration job rather\nthan an architectural one.\n\n## Method\n\n`shell/lib/*` stay **submodules, never content** (1.3 GB prebuilt per platform,\nplus ~790 MB in git-LFS). The FreeCAD tree stays at the repo root, so no CMake\npath, pixi task, test or doc reference had to move. One build flow:\n`pixi run setup && pixi run app`. The cross-repo payload machinery\n(`fetch_cadex_engine.py`, `cadex_engine.txt`, and two CI workflows) was deleted\nand folded into one in-tree `cadex-app.yml`.\n\n**The one real technical risk was the toolchains.** The engine builds inside\npixi/conda-forge; the shell builds against `shell/lib/<platform>` with Xcode and\na homebrew `cmake`/`ninja`; and both supply zlib, libpng, OpenSSL and Python at\ndifferent versions. `package/app/build_app.sh` filters pixi and conda off `PATH`\nand unsets the ~50 variables conda activation exports before invoking cmake on\n`shell/`. Verified by construction: the resulting `CMakeCache.txt` is identical\nto a pre-merge one apart from the source path.\n\n## Result\n\nMeasured on an actual fresh clone rather than inferred: **~21 minutes end to\nend** with a warm ccache (clone 9 s, setup 43 s, engine 5 min 27 s, payload\n42 s, shell 14 min), then `CADEX-BLENDER-GATE ok: true`,\n`engine_from_bundle: true`, picking 372/372, slider median 0.579 s.\n\nThe consequence for the roadmap is bigger than the merge itself: **Phases 11\n(our engine) and 12 (our shell) stopped being on anyone's critical path** and\nbecame optional internal swaps behind the unchanged protocol \u2014 not cancelled,\nand kept available precisely by the test-pinned protocol. What went live instead\nis Phase 13b: deleting from both inherited trees, in place, under the same\ntwo-commit protocol.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW orientation-and-build \u2014 one repository, two toolchains that must not see each other; `pixi run setup && pixi run app` is the whole build.\n- target: NEW inherited-tree-reduction \u2014 Phases 11 and 12 are unscheduled by choice; 13b is the standing work.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"orientation-and-build","resolved":null,"delta":"one repository, two toolchains that must not see each other; `pixi run setup && pixi run app` is the whole build.","new":true},{"target":"inherited-tree-reduction","resolved":null,"delta":"Phases 11 and 12 are unscheduled by choice; 13b is the standing work.","new":true}],"impact_none":null,"layer":4,"order":0,"seq":6,"chrono":3,"lane":1},{"slug":"open-dew-7293","title":"Prehistory: making it work standalone \u2014 the quality-of-life era","created_at":"2026-08-09T15:15:58+00:00","parents":["merry-eagle-4093"],"content":"## What\n\n29 commits over two days, ADR-031\u2026ADR-055. Not a phase \u2014 the era **after** the\nmerge, in which things that had worked in VibeCAD or in Blender did not yet work\nin Cadex, and two newly joined halves had to be made to behave like one\napplication.\n\n## Why\n\nFollows the merge. In the author's words: \"now that they are together and the\nmerge has landed, how does this system work compared to how it used to work?\"\n\n## Method and Result, grouped by what each fixed\n\n**The application became something a user meets.** The File menu came back, as\nours (ADR-041); no splash screen (ADR-042); chat and Parameters became real\nBlender **editors** rather than abused area types (ADR-035) \u2014 which is what made\nthe layout a saved `.blend` instead of a 340-line Python template (ADR-037),\nbecause a saved screen can record area types and until then the area types were\nlying. An editor Cadex does not build is not offered (ADR-036). The input got a\nstrip of its own and Return sends (ADR-034).\n\n**External geometry became a first-class input** (ADR-043). Phase 4 had shipped\nan ingest path nothing could reach: no product surface wrote `assets/`, an\nimport could not be moved, could not enter the BREP domains, and could only be\nmeasured on the rebuild that produced it. Four changes closed it \u2014 the\n`put_asset` op plus File \u2192 Import Geometry\u2026, `mesh.transform`, `inspect\nscope=\"output\"`/`\"assets\"`, and `part.shape_from_mesh`. Which promptly broke\nSave-As, because the new project got no `assets/` and the first\n`mesh.import_file` died (ADR-046).\n\n**Three defects were invisible because no live test built a joint** (ADR-047,\nADR-048, ADR-049): joints failed headless, simulations could not publish, and a\nsolved assembly never reached the viewport because nothing in the response said\nwhich output a component instanced. A simulation has played in the viewport\nsince ADR-050.\n\n**Safety of the script store.** A refused script must not be able to shut the\nproject (ADR-044), and the script gained a history so `write_script` cannot\nsilently delete a model (ADR-045).\n\n**Then the latency work.** The drag left the main thread (ADR-051); the\ncold-path diet and shared sub-expressions took the engine median 0.505 s \u2192\n0.417 s (ADR-052, ADR-053); and the **warm-standby preview worker** (ADR-055)\nanswers a pose-only parameter change in **33 ms** against the same model's\n0.588 s accepting run \u2014 a read-only oracle that writes nothing at all, with the\ninvariant asserted over the store's full file list, sizes and mtimes across a\nburst of previews. Its stated limit is real: a preview cannot serve a parameter\nthat changes a *definition*, so the headline applies to a subset of sliders.\n\n## Result\n\nMost of the product's felt quality came from this era, and almost none of it was\nplanned in a phase. The pattern that repeats \u2014 and that later eras repeat again\n\u2014 is that a capability shipped in an earlier phase turns out to have no\nreachable product surface, and closing that gap breaks a second thing the first\nwas never written for.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW shell \u2014 the shell is a real application: Cadex File/Edit menus, real editor types, a saved-layout startup file, imported geometry, and a simulation that plays.\n- target: NEW engine \u2014 the preview/accept split: 33 ms pose-only previews against a ~0.42 s accepting path.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"shell","resolved":null,"delta":"the shell is a real application: Cadex File/Edit menus, real editor types, a saved-layout startup file, imported geometry, and a simulation that plays.","new":true},{"target":"engine","resolved":null,"delta":"the preview/accept split: 33 ms pose-only previews against a ~0.42 s accepting path.","new":true}],"impact_none":null,"layer":5,"order":0,"seq":7,"chrono":4,"lane":1},{"slug":"crisp-glacier-6395","title":"Prehistory: the wiring workstream \u2014 routed harnesses, terminals and a node editor","created_at":"2026-08-09T15:16:12+00:00","parents":["open-dew-7293"],"content":"## What\n\nAn independent workstream that landed on **no phase** and ran in the background\nof everything else for eight days: ADR-056, 057, 062, 063, 064, 065, 066, 067,\n074, 113, 114, 115, 117, 118, 119, 120, 121, 122. Procedural wire routing,\ngeometry-anchored terminals, solder joints, a declared connection table, a\ndeclared board table, and a wiring editor drawn in Blender's node editor.\n\n## Why\n\nBranches from the standalone era rather than following it. The author wanted the\napp to model an electronic assembly \u2014 connect terminals, define boards, simulate\nthe harness \u2014 and the routing had to be procedural, because a hand-authored\nharness is not parametric.\n\n**It is also why a piece of Blender came back.** The teardown had ripped a great\ndeal out, including the node-based system Blender ships for geometry nodes. The\nwiring editor re-registers that stock node editor for exactly one Python tree\ntype (ADR-066), so the editor menu gains \"Wiring\" and stays short. Removing\nsomething and then bringing it back for a different purpose is a pattern this\nproject uses deliberately, not an accident.\n\n## Method\n\nSix pure-Python, FreeCAD-free, kernel-neutral modules, staged into the sandboxed\nworker bundle **by filename** rather than imported: `CadexRouting.py` (a lazy\n26-connected A* on an integer lattice, clearance by lattice dilation, a\nline-of-sight shortcut, sag, bounded by a probe budget \u2014 occupancy arrives as an\n`occupied(i,j,k)` callback, so the whole algorithm is unit-testable headless),\n`CadexBundle.py` (a rotation-minimising frame carried by double reflection,\ntwisted and flat conductor offsets, a numeric solve for the lay radius at which\nno two conductors interpenetrate), `CadexTerminals.py`, `CadexSolder.py`,\n`CadexNets.py` and `CadexBoards.py`.\n\n**No protocol change for any of it.** `part.*` and `assembly.*` are the xscript\nsurface, not the op table \u2014 which is the standing reason this much capability\ncost so little contract.\n\n## Result\n\n`wcv8.cadex` is wired with 22 conductors across seven routes: a twisted battery\npair, three twisted phases per motor, and two four-way flat ribbons.\n\nThe solder joint became **one solid of revolution** in ADR-064 \u2014 a closed\noutline, one face, one `revolve`, and no boolean at all \u2014 which deleted the\nfuse, the cut, `CUT_OVERSHOOT_MM` and every kernel hazard the previous design had\ndocumented: nine OCC calls per joint down to three, and eight joints on the probe\nplate from 54 ms to 20.9 ms. The risk moved out of OCC and into pure Python,\nwhere it is decidable headless over a parameter sweep.\n\n**Three defects that only real use found**, and they are the most reusable part\nof this record:\n- The published registry dropped the two fields the endpoint join is made of, so\n  a script predating `nets()` drew every board and not one wire \u2014 hidden by a\n  fixture that disagreed with its producer (ADR-113).\n- A board with two headers is two terminal *sets* that shared the component's\n  name, so the canvas gave one set's sockets to the other and every declared wire\n  lost an end: two boards, no links, `applying\u2026` stuck in the header for the life\n  of the `.blend` (ADR-115).\n- The push started a lifecycle nobody polled, so the revision guard never\n  advanced and every apply after the first was refused `STALE_PROGRAM_REVISION`\n  **in silence** \u2014 twenty wires dragged built one cable, and the next refresh\n  wiped the other nineteen off the canvas (ADR-122).\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW wiring-harness \u2014 routed cables and bundles, geometry-anchored terminals, solder joints, declared nets and boards, and a wiring editor; experimental, with several stated limits.\n- target: NEW shell \u2014 the Wiring editor, and the pick gestures that write table rows rather than script text.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"wiring-harness","resolved":null,"delta":"routed cables and bundles, geometry-anchored terminals, solder joints, declared nets and boards, and a wiring editor; experimental, with several stated limits.","new":true},{"target":"shell","resolved":null,"delta":"the Wiring editor, and the pick gestures that write table rows rather than script text.","new":true}],"impact_none":null,"layer":6,"order":0,"seq":8,"chrono":6,"lane":1},{"slug":"solemn-chart-6274","title":"Prehistory: the organic vertical \u2014 a robot wolf and the section cage","created_at":"2026-08-09T15:16:12+00:00","parents":["open-dew-7293"],"content":"## What\n\nPhase 15 \u2014 slices O0 through O3b in a single day (20 commits), ADR-123\u2026ADR-130.\nMaking the shapes a person actually asks for \u2014 a body, a limb, a skin over a\nmechanism \u2014 buildable by the agent and shapeable by the user without a chat\nturn.\n\n## Why\n\nFollows from ADR-123, which closed by asking for a robot wolf to be rebuilt\nagainst the repaired API surface. It was, and the result **sized the phase**:\nthe agent builds the wolf **entirely in `part`** \u2014 sixteen lofted solids, no\nmesh op \u2014 so the gap is not \"CAD is the wrong paradigm for organic shapes\". It\nis four specific things, one per slice.\n\n## Method and Result\n\n- **O0** (ADR-124) \u2014 the agent could not see what it built. `render_views` fits\n  four cameras to the Model collection (front, right, top, three-quarter) and\n  composites them 2\u00d72 into one image, with the user's session isolated out of it.\n  Verified by driving the built application, because the gate runs\n  `--background` and `draw_view3d` needs a real VIEW_3D \u2014 the ADR says so rather\n  than implying coverage the gate does not have.\n- **O1 / O1b** (ADR-125, ADR-128) \u2014 blends that survive. `part.fillet` bisects a\n  failing edge set and reports what it found (`on_failure` = refuse / skip /\n  reduce); `part.fuse(blend=\u2026)` names the seam edges *because it made them*. The\n  wolf's weld lands: 25 of 48 seams at 8 mm, 25.04 s against a 13.61 s baseline.\n  O1b then took the three things O1 parked, including a real kernel `scale_law`\n  via a new `setLaw` on `BRepOffsetAPI_MakePipeShell` \u2014 two C++ additions that\n  open `docs/FREECAD.md` \u00a72a, the engine's own ledger of delta against upstream.\n- **O2 / O2b** (ADR-126, ADR-130) \u2014 mounts as a declared interface with a static\n  interference check that refuses in cubic millimetres (251.327 mm\u00b3 for a 4 mm\n  peg seated 5 mm in, which is \u03c0\u00b74\u00b2\u00b75), and swept-volume clearance held over a\n  whole trace.\n- **O3** (ADR-127) \u2014 **the section cage**, which is what answers\n  `docs/VISION.md`'s long-standing open question about interactive mesh editing.\n  A shape is a `cage(...)` of superellipse rings the script declares,\n  `part.loft_cage` builds and `set_params(cages=[\u2026])` sets; the shell draws the\n  rings as an edge-only overlay and supplies only the **gesture** \u2014 drag a ring,\n  press Apply. Nothing is authored outside the script, the mesh domain gained no\n  editing surface, and **no new space type was spent**.\n- **O3b** (ADR-129) \u2014 rebuilding the wolf found that **one of its thirteen lofts\n  enclosed 4.5\u00d7 the volume of a straight loft through the identical sections**.\n  `part.loft` and `part.loft_cage` now measure how far the surface escapes the\n  sections they were built from and refuse past a quarter of their span. The\n  wolf's half-width fell from \u00b1150.2 mm to \u00b173.0 mm.\n\n**O4 (subD) is parked and unscheduled** \u2014 and because the cage has now been used\nin anger, what it still cannot do is known: a **curved spine** (the wolf's neck\nand tail are the two bodies that stayed hand-written) and **closing an end**.\nNeither is subdivision, and both come first.\n\nThe wolf (`~/arch/woof.cadex`) is the standing benchmark, with a per-slice\nbenchmark log in `docs/ORGANIC.md` \u00a74. Those project files are **live**: copy to\na scratch directory before building or probing.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW organic-modelling \u2014 cages, surviving blends, mounts and clearance; the wolf is the standing benchmark and O4 is parked with its two blockers named.\n- target: NEW shell \u2014 `render_views` gives the agent its own eyes; the cage overlay supplies the gesture and nothing else.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"organic-modelling","resolved":null,"delta":"cages, surviving blends, mounts and clearance; the wolf is the standing benchmark and O4 is parked with its two blockers named.","new":true},{"target":"shell","resolved":null,"delta":"`render_views` gives the agent its own eyes; the cage overlay supplies the gesture and nothing else.","new":true}],"impact_none":null,"layer":6,"order":1,"seq":9,"chrono":13,"lane":5},{"slug":"sage-wood-0687","title":"Prehistory: MJC \u2014 dynamics on MuJoCo, on a permanent branch","created_at":"2026-08-09T15:16:12+00:00","parents":["open-dew-7293"],"content":"## What\n\n89 commits over two days on a branch called `MJC`: slices M0\u2013M8, ADR-075\u2026ADR-085.\nRigid-body dynamics, collision and contact, actuators, MJCF export, declarative\ntraining tasks, offboard training, and a trained policy rolled out in the\nviewport.\n\n## Why\n\nBranches from the standalone era. It depends on nothing after Phase 9 and\nnothing depends on it, which is exactly what made it a separable vertical rather\nthan a fork in the roadmap.\n\nThe author wanted simulation, and deliberately did **not** build it out of\nFreeCAD's native simulation or Blender's armature-based one. MuJoCo is a free,\nrobust platform for physics, robotics and reinforcement learning, and it is kept\n**upstream and unmodified** \u2014 a kernel in the OCCT category, not a tree we fork\n(ADR-075).\n\nIt started life as a *permanent* branch (ADR-078), on the argument that a\nbracket modeller should not have to pay for a physics engine.\n\n## Method\n\n`CadexDynamics.py` \u2014 7,296 lines and the largest module in the tree \u2014 does every\narithmetic operation **including every unit conversion**; the worker does every\nFreeCAD read and nothing else, and a test greps to keep that true. The\ndependency is `mujoco == 3.10.0`, exactly pinned for the same reason\n`occt == 7.8.1` is, and it arrives as a **pypi wheel** carried by name through\n`CARRIED_PYPI_PACKAGES` because the conda manifest has not been re-solvable\nsince conda-forge moved past the `occt` pin (ADR-076).\n\nSlices are `M0`\u2026`M8`, each a resting place, each with four test files: `*_api`\n(the authoring surface and its refusals), `*_model` (what reaches the compiled\n`mjSpec`), `*_measured` (numbers checked against a reference rather than against\nourselves) and `*_live` (the whole path through a real worker).\n\n## Result\n\nThe arc closed at M8 (ADR-085): \"design me a quadruped and teach it to walk\" is\na sequence of chat turns that terminates in a viewport playing a learned gait.\nThe whole arc M0\u2013M8 landed with an **empty `shell/` diff**.\n\n**What each slice's own written plan got wrong is the most transferable part of\nthis record**, and the ADRs say so in as many words:\n- **M3** \u2014 convex decomposition was not needed and is not in it: a concave part\n  is *refused*, naming its volume error, because MuJoCo hulls a collision mesh\n  silently. \"Forced single-threaded\" was never a flag; islands are a *disable*\n  bit that was on by default, and the risk was constraint ordering, not threads.\n- **M4** \u2014 there is no control callback. MuJoCo's position actuator *is* the PD\n  loop, closed in C, so a script supplies a setpoint (a whitelisted formula of\n  `time`). And joint damping was not a later slice: a stiff gain on an undamped\n  joint rings at sixty degrees peak to peak for ever.\n- **M5** \u2014 `to_xml()` writes six significant figures with no precision knob, so\n  inertia round-trips to 2.4e-6 and \"matches the in-engine simulation\" is a\n  measured tolerance, not an identity. The export reloads and diffs its own file\n  before returning it, and refuses rather than writing.\n- **M6** \u2014 MuJoCo's frame sensors take an `objtype` that reads as one thing and\n  is two: `body` is the inertial frame and `xbody` the frame the assembly solver\n  placed, a half turn apart on a plain box. A reward naming a component's\n  position would silently have been handed its centre of mass.\n- **M7** \u2014 `np.savez` *is* byte-deterministic (contradicting the plan outright),\n  and a pure-Python forward pass runs at **4,564 Hz** against a 50 Hz control\n  rate, so numpy stayed out of the engine entirely.\n\nThree invariants came out of the arc and are all test-pinned: nothing in\n`shell/` imports mujoco; `CadexDynamics.py` is reachable from the sandboxed\nworker and **never** from `cadexd`; and no `jax` or `mjx` anywhere under\n`src/Mod/cadex` or in a staged payload.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW dynamics-and-control \u2014 the whole arc from a solved assembly to a played-back policy, engine-side, behind the unchanged protocol.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"dynamics-and-control","resolved":null,"delta":"the whole arc from a solved assembly to a played-back policy, engine-side, behind the unchanged protocol.","new":true}],"impact_none":null,"layer":6,"order":2,"seq":10,"chrono":11,"lane":4},{"slug":"jolly-walrus-3692","title":"Prehistory: the 07-31 spike \u2014 a headless CLI, and training moves to a GPU box","created_at":"2026-08-09T15:16:12+00:00","parents":["merry-eagle-4093","sage-wood-0687"],"content":"## What\n\n51 commits in one day \u2014 the busiest in the repository's history. Two top-level\ndirectories were born on it: `cli/` (ADR-061) and `training/` (ADR-084), plus\nremote dispatch shortly after (ADR-089). Per the author, it was simply a day\nwith a lot of time, spent banging on several things at once: the wiring side, a\nheadless CLI, and standing up the remote training environment.\n\n## Why\n\nBranches from the merge era and from the MJC arc. The CLI is new scope that no\nphase declared; `training/` is the direct consequence of M7 deciding that\ntraining happens elsewhere.\n\n## Method\n\n**`cli/`** is a second *front end* and a third client of the same protocol: no\nBlender, no display, no shell code, four subcommands (`-p`, `params`, `script`,\n`export`) of which exactly one spends tokens. Its whole model-facing tool surface\nis **generated from `OP_ARG_SPECS`**, so it cannot drift from the contract it\ndrives. It is LGPL, and the licence boundary against the GPL `shell/` is one-way\nand hard: copying a line of the shell's client into `cli/` relicenses the engine\nside and is not a judgement call.\n\n**`training/`** is the one top-level directory that is deliberately *not part of\nthe product*. CMake never installs it, no payload carries it, nothing in it\nenters `pixi.toml`, and it cannot import Cadex \u2014 it reports whether\n`CadexDynamics` was importable so a test can assert the negative. Its four\ndependencies (`jax`, `mujoco`, `mujoco-mjx`, `flax`) are exactly pinned in\n`training/requirements.txt` and installed into a venv **on whatever machine\ntrains**.\n\n**The machines, which nothing in the repo states.** Development happens on the\nauthor's MacBook and Mac mini. Training happens on a **cloud server with a\nGPU**. `training/remote_train.sh` dispatches a run there; results come back by\nrsync and are viewed locally \u2014 later, in live mode.\n\n## Result\n\nThe CLI cost **no engine change and no protocol change**: `OP_ARG_SPECS`, the\nADR-027 goldens and `docs/INTEGRATION.md`'s op table are untouched. That is the\npoint \u2014 a third client that needed the contract widened would have been evidence\n*against* the contract, and instead it is the first direct evidence for the\nPhase 11/12 claim that either half is replaceable.\n\n`remote_train.sh` refuses a run that silently fell back to CPU, and a box whose\npinned versions do not match, because both otherwise show up only as a number\nnobody compares. ADR-098 later found two silent bugs in it: `train.pid` held the\nwrapping subshell rather than the trainer, so `stop` reported success while a\n4,000-iteration run carried on; and `shquote` mis-escaped embedded single quotes\nunder bash 3.2.\n\n**Known and deliberate gaps in `cli/`**: it has never been run on macOS by hand;\nexport runs as a `FreeCADCmd` subprocess rather than an `export_model` op; BREP\noutputs only, with mesh and component outputs reported `skipped`; no\n`resolve_pin` and no offscreen rendering; it does not ship inside the engine\npayload; Windows is unsupported.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW cli \u2014 a third protocol client with no display and a generated tool surface; verified on Linux, unverified on macOS.\n- target: NEW rl-training-loop \u2014 training is offboard on a GPU box, dispatched by script and pulled back by rsync.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"cli","resolved":null,"delta":"a third protocol client with no display and a generated tool surface; verified on Linux, unverified on macOS.","new":true},{"target":"rl-training-loop","resolved":null,"delta":"training is offboard on a GPU box, dispatched by script and pulled back by rsync.","new":true}],"impact_none":null,"layer":7,"order":0,"seq":11,"chrono":8,"lane":3},{"slug":"open-key-6334","title":"Prehistory: the branch ends \u2014 MJC merges into main","created_at":"2026-08-09T15:16:12+00:00","parents":["sage-wood-0687"],"content":"## What\n\n`MJC` stopped being a permanent branch and became the product (ADR-102). The\n`MJC` ref still exists, pointing at the merge; nothing should be committed to\nit. **There is one branch.**\n\n## Why\n\nFollows the MJC arc. ADR-078 had made the branch permanent on the argument that\na bracket modeller should not pay for a physics engine. The author measured that\ncost instead of continuing to assume it.\n\n## Method and Result\n\n**53.5 MB on a 3.3 GB application, and nothing at all at runtime** for a user\nwho never calls it \u2014 because `CadexDynamics.py` is deferred-imported and\nreachable only from the sandboxed worker. About 30 MB of the 53.5 is\n`mujoco/experimental/`, a studio viewer the engine never imports; pruning it is\nknown and deferred.\n\nWhat the merge dissolved: the one-way sync discipline, the branch-marked doc\nblocks, and the empty-`shell/`-diff rule. What it did **not** dissolve is the\nboundary underneath it \u2014 dynamics is engine-side, the shell never learns MuJoCo\nexists, and training happens on a machine we do not ship to.\n\nThe `shell/` diff was spent afterwards, deliberately and once, on the collision\noverlay (ADR-091), and only inside `mesh_agent/` and the gate suite. The rule\nthat replaced \"empty diff\" is what the empty-diff rule was always a proxy for:\n**every line of our `shell/` diff is under\n`shell/scripts/addons_core/mesh_agent/` or `shell/tests/python/`, and the\ninherited Blender tree is untouched.** `docs/BLENDER-TREE.md` \u00a72a is eight files\nand must stay eight.\n\nOne consequence for anyone reading history: the merge **renumbered part of the\nADR log**. ADR numbering is not contiguous and must not be assumed to be \u2014\nADR-054 was deliberately never written (the item was measured at 17.7 ms, ~4.2 %\nof a drag, and declined, keeping its number in `ROADMAP.md` so it can be\nrevived), 069\u2013072 and 111 are absent, and 060\u2013067 plus 074 were renumbered on\nthe merge. Cite an ADR by number **and** title.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW dynamics-and-control \u2014 dynamics is ordinary product surface on one branch, not a vertical on a fork.\n- target: NEW orientation-and-build \u2014 ADR numbering is not contiguous; the `MJC` ref is frozen at the merge.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"dynamics-and-control","resolved":null,"delta":"dynamics is ordinary product surface on one branch, not a vertical on a fork.","new":true},{"target":"orientation-and-build","resolved":null,"delta":"ADR numbering is not contiguous; the `MJC` ref is frozen at the merge.","new":true}],"impact_none":null,"layer":7,"order":1,"seq":12,"chrono":10,"lane":4},{"slug":"humble-path-4466","title":"Prehistory: mg-legs and the RL grind","created_at":"2026-08-09T15:16:12+00:00","parents":["open-key-6334"],"content":"## What\n\nThe longest continuous investigation in the project: making a two-legged machine\nstand, and then recover from a shove. Slices M9, M9b and M9c and their follow-ons\n\u2014 ADR-088, 090, 092\u2026101, 103\u2026107, 112, 116, 131, 132, 134, 135. The machine is\n**`mg-legs`**: a pelvis and two legs built from **MG90S servos**, designed in\nCadex, solved as an assembly, exported to MJCF and trained on MuJoCo/MJX.\n\n## Why\n\nFollows the merge. Once dynamics was ordinary product surface, the author wanted\nto know whether it actually worked \u2014 and a real machine, trained end to end, is\nthe only thing that answers that.\n\n## Method\n\nThe order is load-bearing and is written down in `docs/MUJOCO.md` \u00a77 because\nthree machines have now gone through it identically: author the mechanism in an\nordinary xscript project; `assembly.mjcf` exports it with exact OCCT inertias;\n`assembly.task` states the control problem as data; `training/cadex_train.py`\nsolves it on the GPU box; `assembly.policy` verifies the returned weights\nagainst a recorded **witness**; `assembly.rollout` plays it. Evaluation is local,\nin stock MuJoCo, over twelve seeds. Every step but the last is cheap; the last\ncosts hours of GPU time, which is why a feasibility gate runs first.\n\n## Result \u2014 and almost every finding is about an instrument, not a policy\n\n- **The leg could not push** (ADR-090): 26.9 N\u00b7m needed to hold a crouch against\n  12 given, so **0 of 27** scripted push-offs left the ground and no policy could\n  ever have hopped. The previous ADR had read that collapse as a deliberate tuck.\n- **A tensor core rounded the witness, and four hours died of it** (ADR-094).\n- **The policy stood by bracing, not balancing** (ADR-096) \u2014 three motors above\n  95 % of stall on 100 % of frames \u2014 and the task could not have told the\n  difference. Found in one glance by a panel that plots each actuator's command\n  against its own derived limit.\n- **The trainer never ended an episode** (ADR-101): `horizon` was read and never\n  used again, so an environment whose policy did not fall over never reset \u2014 past\n  the last shove window it stood still collecting the alive bonus. **Every reward\n  figure recorded before this is non-comparable.**\n- **The evaluator compounded its own domain randomisation** (ADR-103 \u00a79):\n  `evaluate_episode` multiplies randomisation into the model in place and never\n  restores it, and the comparison script reused one model, so after 72 episodes\n  link masses and inertias stood at 0.23\u00d7\u20133.9\u00d7 their exported values, drifting\n  the same way down every table. This **withdrew** the headline reward-versus-\n  survival inversion that three separate candidates had been queued to explain.\n- **The frame was read 90\u00b0 wrong** (ADR-107): `azimuth_degrees` is about world\n  +X and mg-legs faces +Y, so the \"forward/backward\" columns held the *lateral*\n  pushes for an entire investigation, inverting the motivation for adding ankle\n  roll.\n- **No reward term had ever named the feet** (ADR-112). Both spatial terms\n  measured the centre of mass against the fixed floor point the machine stood on\n  at t=0, so moving a foot changed the reward by nothing and a *completed* step\n  cost \u22120.57/step for ever. The machine was never refusing to move its feet; it\n  was stepping in place.\n\nRe-referencing both spatial terms to the foot centroid and adding a\ncapture-point term produced **B6**: 2,500 iterations, 3.9 h, and checkpoint 2400\nscores **6/12 on \"stepped AND survived\" \u2014 a number that had been zero in every\nrun this project had ever done**, across five prior runs and all their\ncheckpoints. Selection was by stepping-and-surviving, **not by reward**, for the\nthird measured time.\n\nTwo engine capabilities came out of the grind and cost one table row each:\n`centre_of_mass_velocity` (ADR-112) and `centroidal_angular_momentum`\n(ADR-116) \u2014 the second because every B6 death is `tipped` and not one is\n`collapsed`, so the failure this project keeps measuring is rotational.\n\nAlso settled here: MJX and stock MuJoCo agree to float64 machine epsilon with\ncollision disabled and with a `plane` floor, and differ **only about box against\nbox** \u2014 which is what `export_mjcf` writes for every grounded body (ADR-103).\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW rl-training-loop \u2014 a real biped, a policy that steps and lands, and a long list of instruments that lied.\n- target: NEW dynamics-and-control \u2014 two new observation kinds; MJX and MuJoCo agree except about box-against-box contact.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"rl-training-loop","resolved":null,"delta":"a real biped, a policy that steps and lands, and a long list of instruments that lied.","new":true},{"target":"dynamics-and-control","resolved":null,"delta":"two new observation kinds; MJX and MuJoCo agree except about box-against-box contact.","new":true}],"impact_none":null,"layer":8,"order":0,"seq":13,"chrono":7,"lane":2},{"slug":"mellow-hawk-8610","title":"Prehistory: live mode \u2014 a machine you can push","created_at":"2026-08-09T15:16:12+00:00","parents":["humble-path-4466"],"content":"## What\n\nADR-109, ADR-110 and ADR-136: a running mechanism in the viewport, with the\npolicy answering, that the user can shove with the mouse.\n\n## Why\n\nFollows the RL grind. Reading numbers off twelve-seed tables is a poor\ninstrument for a question like \"does this look like it is balancing\"; watching it\nand pushing it is a better one.\n\n## Method\n\nThree read ops (`live_open` / `live_step` / `live_close`), a resident\n`--safe-mode` worker running **the same** `evaluate_episode` the offline path\nruns, and exactly one new seam \u2014 `forces=(step, data, time_s)`, additive and not\na digest input, needed because `apply_disturbance` rewrites `xfrc_applied` from\nzero every step. The shell owns the clock.\n\n## Result\n\n**344 \u00b5s a control step (29\u00d7 real time)** and a **1.72 ms** median `live_step`\nround trip against a 33 ms bar, identical from the staged payload. Driven end to\nend on mg-legs it runs at real time, takes 1.5 N from three sides, and goes over\nat 8 N.\n\nThen the instrument had to be made readable twice more:\n- **ADR-110.** Every session opened with the whole declared episode running, so a\n  hand push landed on top of four other forces. **Calm mode** is one boolean on\n  `live_open` that reaches `evaluate_episode`'s existing *unseeded* episode \u2014\n  which live mode could never ask for, because the seed was coerced to `0`. The\n  force arrow is drawn from the `xfrc_applied` a frame carries back, at `xipos`,\n  so it is **measured rather than intended**, and it is a **sum**: a user's shove\n  and the task's wind on one body are one arrow. Hold-to-push needed no engine\n  change \u2014 re-sending a 0.15 s push every tick is a continuous force. Fixed on\n  the way: ADR-109's `forces` guard read one half of its condition and let a push\n  accumulate 4, 8, 12\u2026 N.\n- **ADR-136.** Live mode truncated every six seconds, because it played the\n  *task's* episode \u2014 the length a trainer wanted, not a viewer. Nothing physical\n  is there: an observation carries no clock, so the policy cannot tell step 301\n  from step 5. Two keywords on `evaluate_episode`, both defaulting to the old\n  loop: `endless` drops the horizon, and `record_steps=False` is what makes that\n  affordable \u2014 the per-step history is 6.1 kB a step and live mode reads none of\n  it. Measured: half an hour of simulation, 300\u00d7 the old horizon, grows the\n  process by **+1.6 MB** against **+553 MB**, at the same throughput.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW dynamics-and-control \u2014 live mode: a policy you can watch and push, at 29\u00d7 real time, from the shipped bundle.\n- target: NEW shell \u2014 the Live editor and the force-arrow draw handler.\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"dynamics-and-control","resolved":null,"delta":"live mode: a policy you can watch and push, at 29\u00d7 real time, from the shipped bundle.","new":true},{"target":"shell","resolved":null,"delta":"the Live editor and the force-arrow draw handler.","new":true}],"impact_none":null,"layer":9,"order":0,"seq":14,"chrono":9,"lane":2},{"slug":"winter-rain-7897","title":"Adopted Hypergraph","created_at":"2026-08-09T15:16:51+00:00","parents":["crisp-glacier-6395","jolly-walrus-3692","mellow-hawk-8610","solemn-chart-6274","slender-basin-4979","kind-ledge-5493"],"content":"## What\n\nCadex adopted the Hypergraph two-graph protocol on 2026-08-09. This node is the\n**epoch marker**: record nodes created strictly before it are legacy history and\nexempt from I2 template compliance; everything at or after it is held to the full\nprotocol, and authoring is never exempt.\n\n## Why\n\nThe project had 16 days of dense history \u2014 248 commits, 136 ADRs, and a doc set\nthat is deliberately evidence-grade \u2014 and no machine-readable projection of\n*what is true now*. The ADR log answers \"why did this happen\"; it does not answer\n\"what should I not waste a day on\", which is what an arriving agent needs first.\n\nParented on all six prehistory tips, so the marker is the single record tip and\nthe high-water mark over it covers the whole authored history.\n\n## Method\n\n**Mode B \u2014 ground-up adoption.** There was no legacy hosted graph to import:\nnothing in the repository referenced a graph store, and the survey found no\nanchors. Nothing was truncated and no archive reference is needed, because there\nwas no archive. Config carries an `epoch:` block and **no `archive:` block**,\nwhich is correct for mode B and is not an omission.\n\nAuthored, in order:\n1. `hypergraph adopt --survey` for the computed facts (git shape, timeline\n   signals, churn, doc inventory, onboarding files).\n2. A full read of `docs/VISION.md`, `README.md`, `docs/IDEAS.md`,\n   `docs/ROADMAP.md` (all 1,617 lines), `docs/ARCHITECTURE.md`,\n   `docs/MUJOCO.md` \u00a75\u2013\u00a76, `docs/ORGANIC.md` \u00a73\u2013\u00a74, and the 136 ADR titles.\n3. **An interview with the author** (2026-08-09), taken as a brain-dump against a\n   seeded question list. This is where the pre-repo era, the era names, the\n   machines, the undocumented dead ends and the fragility assessment came from \u2014\n   none of it is derivable from the tree.\n4. `hypergraph adopt --init`, which minted both roots and wrote the config.\n5. **Fourteen prehistory record nodes**, one per era or workstream, each citing\n   the doc, ADR or interview answer its claims came from.\n6. This marker, then the state graph distilled from the prehistory nodes'\n   declared impacts.\n\n## Result\n\n- Record graph: 14 prehistory nodes plus two roots plus this marker.\n- State graph: ten nodes \u2014 seven components under the root and three children \u2014\n  with a frontier of three (`file-lifecycle` broken, `rl-training-loop` blocked,\n  `inherited-tree-reduction` open).\n- **What did not come across, stated rather than assumed**: no artifacts, because\n  there was no source graph to carry them from. Every claim in the state graph\n  cites a prehistory node, and every prehistory node names its own evidence \u2014 a\n  doc, an ADR number, a commit range, or the interview. Interview-only claims are\n  marked as such and carried at low confidence, because they are the ones that\n  cannot be re-derived from the repository.\n- The ADR log is **not superseded**. `docs/DECISIONS.md` remains the narrative\n  record of decisions and stays the place a direction change is argued; the\n  record graph is where a unit of work lands with a declared state impact, and\n  the state graph is the distilled projection. Work that earns an ADR usually\n  earns a record node too, and they should agree.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\nnone: the marker records the conversion itself and changes nothing about the product; the state graph it enables is distilled from the prehistory nodes' own declared impacts\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[],"impact_none":"the marker records the conversion itself and changes nothing about the product; the state graph it enables is distilled from the prehistory nodes' own declared impacts","layer":10,"order":0,"seq":15,"chrono":15,"lane":1},{"slug":"western-badger-3023","title":"The author's current-state assessment","created_at":"2026-08-09T15:18:43+00:00","parents":["winter-rain-7897"],"content":"## What\n\nThe author's own assessment of the project's current state, taken in the\nadoption interview on 2026-08-09, plus the repository facts that corroborate or\nqualify each answer. This is the evidence the state graph's frontier is derived\nfrom.\n\n## Why\n\nFollows the epoch marker. The prehistory nodes record what happened; this\nrecords what the author says is *true now*, which is the half no amount of\nreading the tree produces.\n\n## Method\n\nBrain-dump against a seeded question list, then checked against\n`docs/ROADMAP.md`, `docs/ARCHITECTURE.md` and `docs/MUJOCO.md`. Where the\nauthor's answer and the repository agree, both are cited below. Where the answer\nis memory only, it is marked.\n\n## Result\n\n**The two most fragile areas, in the author's words.**\n1. **The dynamics, training and demonstration surfaces** \u2014 \"sometimes it works\n   and sometimes it doesn't, it's really not fully fleshed out; a lot of the\n   windows have most of the stuff you need but not quite\". Everything after the\n   MJC merge is the newest and least settled code in the product.\n2. **The file lifecycle inherited from Blender** \u2014 opening, saving, Save-As,\n   creating a new file, how the `.cadex` project directory relates to the\n   `.blend`, and how the menus come up. Corroborated by the repository, and\n   worse than \"fragile\" in two measured places: nothing hydrates on the\n   file-open path, so a `.blend` opened beside its project shows an empty\n   viewport (`model_objects_on_open = 0`, measured in the shipped bundle,\n   ADR-073); and a digest-moving engine change locks a project out of the UI at\n   *open* with **no visible way back in** \u2014 `ensure_open` returns\n   `CADEXD_RESTORE_FAILED`, Rebuild Model correctly refuses, and the operation\n   that is the remedy (`write_script`) is behind a button that is not drawn in\n   that state. Recovery today is by hand: `open_project restore=false` then\n   `write_script`.\n\n**Blocked on something outside this repository.** The GPU training box runs its\n**own checkout** of `training/cadex_train.py`, and that checkout predates\nADR-104. Dispatching B7 would silently ignore two new draws while recording the\nnew algorithm string in the policy header, so the run is blocked rather than\nskipped (`docs/ROADMAP.md`, Phase 14). The CPU sanity run is green: 50\niterations, \u03c3 0.3006, witness 4.07e-08.\n\n**The related projects, and what they are not.** `~/cdx-rl` and `~/cdx-mjc` are\n**independent spin-off projects that use Cadex**; their agents occasionally open\na pull request here for a wishlist feature, and they are otherwise not part of\nthis repository's concerns. `~/arch` is **not a project at all** \u2014 it is where\nthe author keeps `.blend` and `.cadex` files, and those files are live: copy\nbefore building or probing.\n\n**What would waste a fresh agent's whole day**, which the author named first and\nwithout hesitation: not understanding **which stack a thing is in**. C++ versus\nPython; the Blender shell versus the FreeCAD engine versus Blender's own engine;\nwhat `pixi` does and does not cover; **what needs a build versus what needs an\ninstall**; and what runs on this machine versus the remote GPU box. That is an\norientation failure, not a coding failure, and it is the top reason to read\n`docs/ARCHITECTURE.md` and `CLAUDE.md`'s command table before touching anything.\n\n**Deliberately not being done** (decisions, not gaps): Phases 11 and 12 \u2014\nreplacing the engine and the shell with our own \u2014 are unscheduled by choice\nsince ADR-030; O4 (subD) is parked with its two real blockers named instead;\nthere is no train button and nothing to press; there is no second provider stack\nand no API-key path; and interactive mesh editing exists only as engine ops on a\ndeclared table.\n\n**On the docs.** The author declined to name a false doc claim and asked for it\nto be checked instead. This pass read the doc set and found no claim the code\ncontradicts, but **the pass was doc-level, not a line-by-line audit against\nsource**, and every doc carries its own `Verified against source:` date. Treat\nthat as unverified rather than as a clean bill: where code and doc disagree, the\ncode wins and the doc gets fixed in the same PR.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: NEW file-lifecycle \u2014 the Blender-inherited open/save/save-as/new path and the .blend<->.cadex relationship: broken, with two measured failures and a hand-only recovery\n- target: NEW rl-training-loop \u2014 blocked: the GPU box runs its own checkout of the trainer, predating ADR-104, so B7 cannot be dispatched\n- target: NEW dynamics-and-control \u2014 the newest and least settled surfaces in the product; author rates the training/demo panels as not fully fleshed out\n- target: NEW orientation-and-build \u2014 knowing which stack a thing is in, and what needs a build versus an install, is the top day-waster\n- target: NEW inherited-tree-reduction \u2014 Phases 11 and 12 are unscheduled by decision, not stalled\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"file-lifecycle","resolved":null,"delta":"the Blender-inherited open/save/save-as/new path and the .blend<->.cadex relationship: broken, with two measured failures and a hand-only recovery","new":true},{"target":"rl-training-loop","resolved":null,"delta":"blocked: the GPU box runs its own checkout of the trainer, predating ADR-104, so B7 cannot be dispatched","new":true},{"target":"dynamics-and-control","resolved":null,"delta":"the newest and least settled surfaces in the product; author rates the training/demo panels as not fully fleshed out","new":true},{"target":"orientation-and-build","resolved":null,"delta":"knowing which stack a thing is in, and what needs a build versus an install, is the top day-waster","new":true},{"target":"inherited-tree-reduction","resolved":null,"delta":"Phases 11 and 12 are unscheduled by decision, not stalled","new":true}],"impact_none":null,"layer":11,"order":0,"seq":16,"chrono":16,"lane":1},{"slug":"even-cliff-3863","title":"The engine suite count in the docs was stale by 54%","created_at":"2026-08-09T15:27:26+00:00","parents":["western-badger-3023"],"content":"## What\n\nRan the engine suite to check a doc claim the adoption interview had left open,\nand found it stale by 54 %. `CLAUDE.md` and `docs/ARCHITECTURE.md` both stated\n**1,105 passed / 12 skipped**; the suite actually reports **1,698 passed, 22\nskipped**. Both documents were corrected in the same pass, and\n`ARCHITECTURE.md`'s `Verified against source:` date moved from 2026-08-04 to\n2026-08-09.\n\n## Why\n\nFollows the current-state assessment. Asked what in the docs is now false, the\nauthor declined to name anything and asked for it to be checked instead. This is\nthe check, and it found one \u2014 which also means the assessment node's \"no\ncontradiction found in this pass\" is now qualified rather than wrong: that pass\nwas doc-level, and this one measured.\n\n## Method\n\n`pixi run test-engine` (headless, no build, pixi environment), plus a file count\nunder `src/Mod/cadex/cadex_tests/`. Cross-read against the running suite-count\nline in `docs/DECISIONS.md`, which tracks the number ADR by ADR: 1105 at M8's\nclose (2026-07-31) \u2192 1109 \u2192 1112 \u2192 1153 \u2192 1333 \u2192 1509 \u2192 1532 \u2192 1565 \u2192 1588 \u2192\n1698 (ADR-136, 2026-08-07).\n\n## Result\n\n- Measured: **1,698 passed, 22 skipped in 116.84 s**, exit 0.\n- File counts were stale too: 97 Python files of which 84 are collected test\n  modules (documented as 77 / 64), and 45 `test_dynamics_*.py` files\n  (documented as 38).\n- **The ADR log was never wrong.** ADR-136 records 1698/22 correctly. What\n  drifted is the two *summary* documents that restate a number the ADRs keep\n  updating \u2014 which is the failure mode a `Verified against source:` date is\n  supposed to expose, and did: `ARCHITECTURE.md` carried its own 2026-07-31\n  qualifier honestly, while `CLAUDE.md`'s figure carried no date at all and read\n  as current.\n- Corrected: `CLAUDE.md` command table, `docs/ARCHITECTURE.md` \u00a73 Tests, and\n  that document's verification date.\n\nThe generalisable point, which is why this is recorded rather than just fixed: a\nrestated number in a summary doc has no owner, and the ADR that moves it has no\nreason to know it was restated. Prefer pointing at the command; where a figure\nis restated, date it.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: forest-wind-0342 \u2014 new claim: the engine suite is 1,698 passed / 22 skipped, measured 2026-08-09, replacing the 1,105/12 figure\n- target: early-arbor-7123 \u2014 new negative knowledge: figures restated in summary docs drift silently; the ADR log is the live source\n","is_root":false,"is_hwm":false,"unreconciled":false,"impacts":[{"target":"forest-wind-0342","resolved":"forest-wind-0342","delta":"new claim: the engine suite is 1,698 passed / 22 skipped, measured 2026-08-09, replacing the 1,105/12 figure","new":false},{"target":"early-arbor-7123","resolved":"early-arbor-7123","delta":"new negative knowledge: figures restated in summary docs drift silently; the ADR log is the live source","new":false}],"impact_none":null,"layer":12,"order":0,"seq":17,"chrono":17,"lane":1},{"slug":"quiet-wing-7912","title":"The contract moves to AGENTS.md; CLAUDE.md becomes a pointer","created_at":"2026-08-09T15:35:35+00:00","parents":["even-cliff-3863"],"content":"## What\n\nThe agent contract moved from `CLAUDE.md` to `AGENTS.md`, and `CLAUDE.md`\nbecame a one-line pointer: `@AGENTS.md`. There is still exactly one contract;\nonly the name carrying it changed. Logged as an amendment to ADR-137, which\nhad recorded the opposite decision earlier the same day.\n\n## Why\n\nFollows the doc-drift check, and reverses a call made during the adoption. The\nadoption skill's default is to install its onboarding block into `AGENTS.md`; I\ndeclined, because ADR-005 had deleted `AGENTS.md` to stop two agent-instruction\nfiles disagreeing, and I read recreating the file as undoing that.\n\nThe author pointed out the third option I had missed: `AGENTS.md` holds the\ncontract verbatim and `CLAUDE.md` imports it with Claude Code's `@` syntax, so\nthere is one file to read and one to edit. ADR-005's rationale is satisfied more\ncompletely than before, because the contract is now also legible to agents that\nlook for `AGENTS.md` by convention.\n\n## Method\n\n- `git mv CLAUDE.md AGENTS.md`, so the file's history follows it.\n- `CLAUDE.md` rewritten to the single line `@AGENTS.md`.\n- The hypergraph sentinel block's rationale paragraph rewritten \u2014 it argued for\n  an install target that is no longer the one used.\n- Present-tense pointers repointed in `README.md`, `docs/VISION.md`,\n  `docs/ROADMAP.md`, `docs/BLENDER.md`, `docs/BLENDER-TREE.md`,\n  `docs/FREECAD.md`, `docs/PROVENANCE.md` (18 references) and in\n  `docs/DECISIONS.md`'s preamble.\n- **`docs/DECISIONS.md`'s ADR bodies were left exactly as written.** ADR-005's\n  text says what was decided in 2026-07-24 and rewriting it would falsify the\n  log. ADR-137 was amended instead, because it was written hours earlier in this\n  same session and had never described a shipped state.\n\n## Result\n\n`CLAUDE.md` is one line; `AGENTS.md` is the contract; ADR-137 records the\nsupersession explicitly \u2014 ADR-005's *mechanism* is superseded and its\n*rationale* is not. Adding content to `CLAUDE.md` is now the violation.\n\nThe general lesson, which is why this is a record node and not just a commit: I\ntreated a prior ADR as forbidding a *file name* when what it forbade was a\n*second contract*. Reading a decision's rationale rather than its mechanism\nwould have found the pointer option immediately. When declining a tool's default\non the strength of an old decision, check which of the two the decision actually\nbinds.\n\n## Repo\n\n- repo: git@github.com:theo-kirby/cadex.git\n- branch: main\n- commit: 41e6aa6ceeed3078210e02c1f94d85bd715fbb9d\n\n## State Impact\n\n- target: early-arbor-7123 \u2014 new claim: AGENTS.md is the single agent contract and CLAUDE.md only imports it; adding content to CLAUDE.md is the violation\n","is_root":false,"is_hwm":true,"unreconciled":false,"impacts":[{"target":"early-arbor-7123","resolved":"early-arbor-7123","delta":"new claim: AGENTS.md is the single agent contract and CLAUDE.md only imports it; adding content to CLAUDE.md is the violation","new":false}],"impact_none":null,"layer":13,"order":0,"seq":18,"chrono":18,"lane":1},{"slug":"ancient-current-9419","title":"Linked parts: one project's accepted solid, used in another","created_at":"2026-08-09T16:41:52+00:00","parents":["quiet-wing-7912"],"content":"## What\n\nA part built in one project can now be used in another. It travels as **one\ncontent-addressed file in the consuming project's `assets/`** \u2014 a `.cxpart`\ncontainer carrying an exact OCCT solid plus the script that made it \u2014 along the\npath an imported STL already travels.\n\nFour pieces, shipped together (ADR-138):\n\n- `CadexLinkedPart.py`, a FreeCAD-free container module:\n  `CXPART1\\n | <u64 LE header length> | <canonical JSON header> | <raw BREP>`,\n  deliberately isomorphic to `CadexDynamics`' `.cxpolicy`.\n- `link_part`, a new cadexd `MODELING_OP`\n  (`{source_project, output?, name?}` \u2192 `{name, bytes, sha256, source_revision,\n  source_digest, previous_revision, changed, assets}`).\n- `part.import_part(\"sensor.cxpart\")`, a part-domain leaf yielding a `solid`.\n- `_LINKED_PART_ASSET_SUFFIXES`, a fourth constant joining\n  `_STORED_ASSET_SUFFIXES`; `_ASSET_SUFFIXES` stays exactly three.\n\nPlus **File \u2192 Link Part\u2026** / **File \u2192 Refresh Linked Parts**, a `link_part` MCP\ntool, and `cadex link --from DIR --output NAME`.\n\nThis **answers a question the docs had parked twice** \u2014 `docs/VISION.md`'s \"how\nassemblies-of-parts compose in a single project script (sub-scripts? imports?\none flat script?)\" and `docs/XSCRIPT.md` Part II's *Sub-modules*. The answer is\nnone of the three: a project stays one flat script and composes another through\nthat project's *store*. Both paragraphs were rewritten rather than left standing.\n\n## Why\n\nThe only route between projects was STL: export, `mesh.import_file`,\n`part.shape_from_mesh` \u2014 which `cadex_part_api.py` describes in its own\ndocstring as \"not feature-editable \u2026 for cutting clearance against, not for\nediting.\" The part arrived **baked**: a shell of thousands of planar triangle\nfaces, no params, no rebuild, no way back to the thing that made it.\n\nNothing else existed. There is no include, no sub-script and no cross-project\nreference anywhere in the engine; the AST policy refuses every `import`\nstatement outright, and `assembly.component` refuses a foreign source by name.\n\"Use the sensor module I built last week\" was impossible.\n\n## Method\n\nTwo findings from exploration carried the design, and both were checked before\nany code was written.\n\n**The accepted solid is already a file on disk.** `accepted_attempt_dir`,\n`load_worker_report` and `accepted_output_item` (public since ADR-043) locate a\npinned staging directory holding `request.json` \u2014 the exact source that ran \u2014\nand `outputs/output-NNN.brep`. `prune_artifacts` resolves `accepted_attempt` and\nskips it explicitly (`CadexScriptStore.py:324`), which is the one assumption the\nwhole pull path rests on. So `build_linked_part` is **pure Python file reading:\nno FreeCAD, no worker, no OCCT call**, and the source project may be closed, or\nopen in another session, while it runs.\n\n**The asset union has now been widened three times at zero cost.**\n`_STORED_ASSET_SUFFIXES` is the union of separate constants \u2014 ADR-084 added\n`.cxpolicy`, ADR-135 added `.json`/`.xml`, this adds `.cxpart` \u2014 because\nwidening the union costs no `shell/` diff while widening `_ASSET_SUFFIXES`\n(mirrored by name at `cadex_backend.py:53`) would.\n\n**One op, not two.** The obvious shape is export from A, import into B: two\noperations, two sessions, a file the user shuttles by hand. Collapsing it to\n\"B pulls from A's directory\" removes all three, and A never opens. Refresh is\nthen *the same call with the same arguments* \u2014 overwriting an asset is\nre-import, which `store_project_asset` already did \u2014 so there is no second op\nand no second code path.\n\n`link_part` is a `MODELING_OP` for ADR-043's reason verbatim: it ends in the\nsame `store_project_asset` call, and membership is what makes it mutually\nexclusive with an in-flight rebuild.\n\nThe build order was container \u2192 op \u2192 script primitive \u2192 **end-to-end** \u2192 shell \u2192\nCLI \u2192 docs, with the end-to-end step non-optional. ADR-135 is why: ADR-134\nshipped unusable with all 52 of its unit tests green because not one went\nthrough `store_project_asset`.\n\n## Result\n\n**All gates green.**\n\n- `pixi run python -m pytest src/Mod/cadex/cadex_tests` \u2014 **1,723 passed, 22\n  skipped** (was 1,698).\n- `pixi run python -m pytest cli/tests` \u2014 **80 passed** (was 76).\n- `CADEX_ENGINE_ROOT=build/engine/cadex-engine-0.0.0-macos-arm64 pytest\n  test_cadexd_lifecycle.py test_linked_part_live.py` \u2014 **14 passed against the\n  packaged payload**, which is what proves `CadexLinkedPart.py` actually ships.\n- `pixi run gate` \u2014 `\"ok\": true`, no failures.\n\n**The measured claim.** `test_linked_part_live.py` drives two real cadexd\nchildren: project A builds a sensor and accepts it, B pulls it, imports it, cuts\na plate with it and hangs an assembly component on it; then A's bore moves, B\nrefreshes, B rebuilds, and B's geometry follows. The imported solid's volume\nequals A's to `rel=1e-12` and its **face count equals A's exactly** and is under\n100 \u2014 which is the whole difference from the STL route, stated as a number.\n\n**The `simple-willow-8989` risk was checked, not reasoned about.** A refresh\nmoves B's digest by design, and a digest-moving change that a project cannot\nrestore from would lock it out at open with no button back in. The live test\ncloses B after the refresh, reopens it, and asserts the restore pass performed\n**and matched**. It does \u2014 refresh goes through the ordinary rebuild path rather\nthan swapping bytes under an accepted model.\n\n**One defect found and fixed on the way.** `cadex_backend._assets_in` filtered\nSave-As's carry-forward on the shell's three-suffix `ASSET_SUFFIXES`, so a\nSave-As would have **dropped** every `.cxpart` and left the new file with a\nscript that could not run \u2014 ADR-046's exact bug arriving on a new file type. A\nseparate `CARRIED_ASSET_SUFFIXES` fixes it and the gate pins it.\n\n**What it gives up**, stated rather than discovered later: a linked part is a\nsnapshot, not a live link; an ADR-029 selector naming a face of it can break on\nrefresh (correctly and loudly \u2014 the refusal names the selector); one solid per\ncontainer; and `project_root` in the header is a hint, never a load-bearing path.\n\n**Carried and not yet read.** The header records the source project's `script`,\n`params` and `param_specs`. Nothing in this slice consumes them \u2014 they are what a\nparameter override (`part.import_part(\"s.cxpart\", bore=6)`) needs and what makes\na linked part rebuildable rather than baked. Recording them now costs bytes;\nadding them later would cost a container version bump. A test asserts them so\ntheir presence reads as a decision rather than an oversight.\n\n**Shell diff:** +541/-5 across six files, every one under\n`shell/scripts/addons_core/mesh_agent/` or `shell/tests/python/`. Nothing in\n`docs/BLENDER-TREE.md` \u00a72 moved; \u00a72a is still eight files.\n\n## Negative knowledge\n\n- Sub-scripts and Python imports are the wrong answer for composing projects,\n  and not because the sandbox forbids them. They would make a rebuild here\n  depend on another project's current state, its assets and its engine version.\n  A content-addressed container makes it deterministic from this project's own\n  `assets/` alone.\n- The viewport polygon count cannot distinguish a linked BREP part from a\n  converted STL: the mesh in the viewpo
