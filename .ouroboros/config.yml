run: orun18
goal: .ouroboros/goal.md
memory: auto            # -> governor (.flywheel/ + CLI present, ADR-672)
backend: headless       # tmux: one streaming window per harness call in the run session
# Where the loop lives: a systemd user unit, ouroboros-<run>.service, tied to no
# terminal, so a tern or tmux restart cannot end a run. memory_max caps the run and
# everything it starts, engines and trainers included: a runaway FreeCADCmd (60 GB
# once, which took the tmux session down) is killed alone. sb1x has 60 GB.
launcher: systemd
memory_max: 40G
# Three roles (Ouroboros a38d801). The actor works and ends with a report; the
# critic is one read-only call that grades it, answers as the sleeping user and
# writes the next prompt; the scribe records the unit, folds the memory when due,
# and keeps the run's page (runs/<run>/view/). No maintainer, no planner.
critic: agent           # rules: the deterministic fallback only, no model call
scribe: agent           # rules: the loop writes the record itself
idle_interval: 30m
roles:
  # Owner-directed launch (ot11, kept for orun1 through orun18): Opus 5.5 for every role, with no fallback.
  actor:
    harness: claude
    model: claude-opus-5-5
    timeout: 120m
    resume_for: 1
  critic:
    harness: claude
    model: claude-opus-5-5
    timeout: 10m
  scribe:
    harness: claude
    model: claude-opus-5-5
    timeout: 20m
  reporter:
    harness: claude
    model: claude-opus-5-5
    timeout: 10m
git:
  branch: null            # -> ouroboros/orun18
  tag_on_accept: true
  revert_on_reject: false # fix forward: the charter forbids reverting this run's own
                          # commits. A rejected commit stays, gets no ok tag, and the
                          # critic's fix is the top of the next actor prompt.
  allow_dirty: false
stop:
  after: 24h              # owner: 24h, orun18 (2026-10-23); on_done_accepted below is the other way out
  max_iterations: null
  max_cost_usd: null      # subscriptions; nothing here is billed per call
  max_usage: null         # a window crossing a line must not end the run: the
                          # window resets while the run is still going, and the loop
                          # waits it out by itself. `limits.reserve` blocks the harness
                          # instead, which is what leaves Claude for the operator.
  until: null            # use after:; runner cannot compare timezone-bearing deadlines
  on_done_accepted: 2     # report_done charter: two accepted done verdicts end the run
  max_stuck: 25           # `stuck` is a loop that changed nothing; backoff makes 25 ~3.8h
graph:                  # when the scribe folds
  reconcile_every: 5      # housekeeping is due after this many worked iterations...
  pressure: 3             # ...or at this many unreconciled record nodes
  budget_units: 1
limits:
  cooldown: 30m           # block a limited harness this long when it does not say when it resets; doubles
  max_cooldown: 3h
  transient_strikes: 3
  reserve:
    claude: 0.99          # this is the quarry account and the run may have all of it.
                          # Kept just under 1.0 so the loop steps aside a moment before
                          # the hard limit and waits, instead of spending
                          # an actor turn discovering the wall.
loop:                     # motion without progress (ouroboros DESIGN.md section 6b)
  product_after: 8        # iterations changing only records, plans and STATE.md
  frontier_after: 30      # iterations with no node moving and no criterion ticked
  escalate_every: 5
  rotate: false           # all roles stay on the owner-selected Opus model
                          # Nothing here stops the run.
report:                   # the reporter: an observer outside the loop (ouroboros DESIGN.md section 15).
                          # It reads this run directory and never the loop, so nothing it
                          # does reaches the run. `ouroboros run` starts it beside the loop.
  notify: auto            # pushover when PO_USER and PO_TOKEN are set; off, and says so, otherwise
  every: 4h               # a model-written digest this often. A 12h run unattended is three of
                          # them, which is a phone worth reading rather than one worth muting.
  on:                     # the fixed-text alerts, sent the moment the files say so and with
                          # no model involved -- when usage runs out, a model cannot report it
    - needs_human         # the loop could not decide; it is waiting for you
    - stopped             # the run ended, with the reason
    - limited             # a harness is out of usage (urgent when every harness is)
    - stuck               # three `stuck` verdicts in a row, then at ten and twenty
    - looping             # the loop detector acted: a re-plan or a model rotation
    - engine_error        # at most one an hour
    - silent              # the process is gone, or has not written for `silent_after`
    - done_accepted       # the critic accepted done; `on_done_accepted: 2` ends the run at the next
                          # `reject` is deliberately absent: this run fixes forward
                          # (revert_on_reject: false), so a reject is the critic working, not news.
                          # The digest counts them, and a *failed* revert still arrives as needs_human.
  silent_after: 150m      # the actor's timeout is 120m, so quiet for longer than that is a call
                          # that outlived its own kill, not a long iteration
  poll: 30s
  max_chars: 1000         # one notification; the whole digest is kept in runs/orun18/reports/
