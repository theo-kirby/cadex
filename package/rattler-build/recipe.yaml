about:
  license: LGPL-2.1-or-later
  license_file: LICENSE
  summary: The Cadex engine — a headless AI-native CAD service (FreeCAD fork)
  repository: https://github.com/theo-kirby/cadex

context:
  version: "0.2.0"

package:
  name: freecad
  version: "${{ version }}"

source:
  path: ../..
  use_gitignore: true

build:
  number: 0
  script:
    env:
      # rattler-build runs the build in a sandbox that does not inherit shell
      # variables, so any ccache settings must be forwarded explicitly here.
      # CCACHE_DIR is empty for local builds; build.sh/build.bat unset it in that
      # case so ccache falls back to its own default cache location.
      CCACHE_DIR: ${{ env.get("CCACHE_DIR", default="") }}
      # Cap the cache so CI stays within the 10 GB GitHub Actions cache budget.
      CCACHE_MAXSIZE: ${{ env.get("CCACHE_MAXSIZE", default="5G") }}
      # Hash compiler *content* rather than mtime so cached objects survive the
      # fresh conda extraction on each CI run (where compiler mtimes change).
      CCACHE_COMPILERCHECK: ${{ env.get("CCACHE_COMPILERCHECK", default="content") }}

requirements:
  build:
    - ccache
    - cmake
    - compilers>=1.10,<1.11
    - doxygen
    - gtest
    - ninja
    - noqt5
    - python>=3.11,<3.12
    - qt6-main>=6.8,<6.9
    - swig>=4.3,<4.4

    - if: linux and x86_64
      then:
        - clang
        - clangxx
        - kernel-headers_linux-64
        - mold
        - patchelf
        - sed
        - sysroot_linux-64

    - if: linux and aarch64
      then:
        - clang
        - clangxx
        - kernel-headers_linux-aarch64
        - mold
        - patchelf
        - sed
        - sysroot_linux-aarch64

    - if: osx and x86_64
      then:
        - __osx >=10.13

    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}

  host:
    - eigen >=3.3,<5
    - fmt >=12.1,<12.2
    - freetype
    - hdf5
    - lark
    - libboost-devel
    - noqt5
    - numpy>=1.26,<2
    - occt>=7.8,<7.9
    - ply
    - pybind11
    - python>=3.11,<3.12
    - qt6-main>=6.8,<6.9
    - six
    - smesh
    - vtk
    - xerces-c
    - yaml-cpp
    - zlib

    - if: win
      then:
        - winpthreads-devel
        - tbb-devel

    - if: unix
      then:
        - sed

  run:
    - blas * openblas*
    - blinker
    - calculix
    - defusedxml
    - gmsh
    - lark
    - lxml
    - noqt5
    - numpy>=1.26,<2
    - occt>=7.8,<7.9
    - olefile
    - pip
    - ply
    - python>=3.11,<3.12
    - pythonocc-core
    - pyyaml
    - qt6-main>=6.8,<6.9
    - requests
    - scipy
    - typing_extensions
    - vtk
