<!DOCTYPE html>
<!-- SPDX-FileCopyrightText: 2026 Cadex Authors
     SPDX-License-Identifier: LGPL-2.1-or-later
     One Ouroboros run (ADR-513), served at /r/<run>/: its iterations, newest
     first, each with the critic's verdict and what it said was done, under
     the charter's done criteria as the run's branch holds them, and the
     run's probe material from docs/probes/<run>/ (ADR-515), and its records
     with the renders, reports and probe pages they name (ADR-518). Read from the
     run directory and the checkout; writes nothing. Tokens are the review page's
     (docs/DASHBOARD.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadex run</title>
<link rel="stylesheet" href="review.css">
</head>
<body>
<header id="top">
  <div class="title">
    <h1 id="run-name">loading…</h1>
    <div id="run-line" class="muted"></div>
  </div>
  <a href="../../">all projects and runs</a>
</header>
<main id="projects-frame">
  <section class="card" id="charter-card">
    <h2>Charter <span id="charter-count" class="muted small"></span></h2>
    <div id="charter-source" class="muted small"></div>
    <ol id="charter" class="criteria"></ol>
    <p id="charter-empty" class="muted" hidden></p>
  </section>
  <section class="card" id="probes-card">
    <h2>Probes <span id="probes-count" class="muted small"></span></h2>
    <div id="probes-source" class="muted small"></div>
    <article id="probe-readme" class="markdown"></article>
    <ul id="probe-images" class="probe-gallery"></ul>
    <details id="probe-files-fold" hidden>
      <summary class="small">every file</summary>
      <ul id="probe-files"></ul>
    </details>
    <p id="probes-empty" class="muted" hidden></p>
  </section>
  <section class="card" id="records-card">
    <h2>Records <span id="records-count" class="muted small"></span></h2>
    <div id="records-source" class="muted small"></div>
    <article id="linked-doc" class="markdown" hidden>
      <div class="linked-doc-head small"><span id="linked-doc-path" class="muted"></span>
        <button type="button" id="linked-doc-close">close</button></div>
      <div id="linked-doc-body"></div>
    </article>
    <ol id="records"></ol>
    <p id="records-empty" class="muted" hidden></p>
  </section>
  <section class="card">
    <h2>Iterations</h2>
    <div id="run-tally" class="badges"></div>
    <table class="grid">
      <thead><tr><th>#</th><th>verdict</th><th>what the critic saw</th><th>commit</th></tr></thead>
      <tbody id="iterations"></tbody>
    </table>
    <p id="iterations-empty" class="muted" hidden>No iterations yet.</p>
  </section>
</main>
<script src="markdown.js"></script>
<script src="run.js"></script>
</body>
</html>
