run: ot4
goal: .ouroboros/goal.md
memory: auto            # -> hypergraph (config + CLI present)
backend: headless       # tmux: one streaming window per harness call in the run session
mode: actor-critic      # a Codex critic grades every changed iteration; a reject becomes
                        # the next iteration's must-fix, not a revert
overseer: agent
idle_interval: 30m
roles:
  actor:
    harness: claude
    model: claude-opus-5
    timeout: 90m
    resume_for: 1
    fallback:
      - { harness: codex, model: gpt-6-astra }   # while Claude is out of usage; back to Claude when it resets
  critic:
    harness: codex
    model: gpt-6-astra
    timeout: 15m
    fallback:
      - { harness: claude, model: claude-opus-5 }
  overseer:
    harness: claude
    model: claude-opus-5
    timeout: 5m
    fallback:
      - { harness: codex, model: gpt-6-astra }
  maintainer:
    harness: claude
    model: claude-fable-5-1
    timeout: 30m
    fallback:
      - { harness: codex, model: gpt-6-astra }
  planner:
    harness: claude
    model: claude-fable-5-1
    timeout: 20m
    fallback:
      - { harness: codex, model: gpt-6-astra }
git:
  branch: null            # -> ouroboros/ot4
  tag_on_accept: true
  revert_on_reject: false # fix forward: the charter forbids reverting this run's own
                          # commits, and the critic's must_fix reaches the next actor
                          # turn either way (engine.py:185). nt2's reverts all failed
                          # and every reject was completed by a later iteration.
  allow_dirty: false
stop:
  after: 48h              # the only thing that ends this run
  max_iterations: null
  max_cost_usd: null      # subscriptions; nothing here is billed per call
  max_usage: null         # a window crossing a line must not end a two-day run: the
                          # window resets while the run is still going, and the loop
                          # waits it out by itself. `limits.reserve` blocks the harness
                          # instead, which is what leaves Claude for the operator.
  until: null
  on_done_accepted: null
  max_stuck: 25           # `stuck` is a loop that changed nothing; backoff makes 25 ~3.8h
handoff:
  recent: 3
hypergraph:
  reconcile_every: 5
  pressure: 3
  budget_units: 1
limits:
  cooldown: 30m           # block a limited harness this long when it does not say when it resets; doubles
  max_cooldown: 3h
  transient_strikes: 3
  reserve:
    claude: 0.99          # this is the quarry account and the run may have all of it.
                          # Kept just under 1.0 so the loop steps aside a moment before
                          # the hard limit and falls back to Codex, instead of spending
                          # an actor turn discovering the wall. The 7-day window resets
                          # 2026-09-09 anyway.
loop:                     # motion without progress (ouroboros DESIGN.md section 6b)
  product_after: 8        # iterations changing only records, plans and STATE.md
  frontier_after: 30      # iterations with no node moving and no criterion ticked
  repeat_bet_after: 3     # planner bets restating a recent bet
  escalate_every: 5
  rotate: true            # rung 3: hand the actor's turn to Codex for a while
                          # Nothing here stops the run. Replayed on nt3, `no_product`
                          # first fires at iteration #50 -- one into the 113-iteration
                          # stall -- against zero firings in the productive stretches.
plan:
  enabled: true           # the plan view (short / medium / long) and the planner after each maintainer pass
  every: 5
  view: plan
  md: PLAN.md
  max_new_directions: 1   # per planner pass; the charter bounds what counts as a direction
