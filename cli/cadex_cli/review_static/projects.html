<!DOCTYPE html>
<!-- SPDX-FileCopyrightText: 2026 Cadex Authors
     SPDX-License-Identifier: LGPL-2.1-or-later
     The home page (`cadex app`, ADR-533, ADR-605): the most recently active
     project in a spotlight, then every project as a card -- its picture, its
     stage, when it last moved and what it holds -- newest first, a page at a
     time, each linking to its page. Polls; writes nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadex</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="review.css">
<link rel="icon" href="data:,">
</head>
<body class="home">
<header id="top">
  <div class="title">
    <h1>Cadex</h1>
    <span id="projects-count" class="muted small"></span>
  </div>
  <div class="top-end">
    <input id="projects-filter" type="search" placeholder="Filter projects" aria-label="Filter projects" autocomplete="off" spellcheck="false">
    <div id="freshness" data-state="loading">loading…</div>
    <button id="theme-toggle" class="icon-button" type="button" title="Light or dark" aria-label="Light or dark">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" class="fill"/></svg>
    </button>
  </div>
</header>
<main id="projects-frame">
  <!-- The project that moved last, large (ADR-605). -->
  <section id="spotlight" aria-label="Most recently active project" hidden>
    <a id="spotlight-media" class="thumb" href="" tabindex="-1" aria-hidden="true"></a>
    <div class="spotlight-body">
      <p class="eyebrow">Most recently active · <span id="spotlight-ago"></span></p>
      <h2 id="spotlight-name"><a id="spotlight-link" href=""></a></h2>
      <div class="chips"><span id="spotlight-stage" class="chip" data-stage="idle">idle</span><span id="spotlight-verdict" class="chip" hidden></span></div>
      <div id="spotlight-progress" class="progress" hidden><span></span></div>
      <p id="spotlight-line" class="muted"></p>
      <dl id="spotlight-counts" class="counts"></dl>
      <p><a id="spotlight-open" class="button" href="">Open project</a></p>
    </div>
  </section>
  <section id="projects-section">
    <h2>Projects</h2>
    <ul id="projects" class="cards"></ul>
    <p id="projects-empty" class="muted" hidden>No projects yet. Start one: point your agent at
      <code>./cadex mcp --project &lt;this directory&gt;/bracket</code> and ask it for a bracket.</p>
    <p id="projects-none" class="muted" hidden>No project matches the filter.</p>
    <nav id="pager" class="controls" hidden>
      <button id="page-prev" type="button">Newer</button>
      <span id="page-at"></span>
      <button id="page-next" type="button">Older</button>
    </nav>
  </section>
</main>
<script src="projects.js"></script>
</body>
</html>
