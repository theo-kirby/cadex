run: nt3
goal: .ouroboros/goal.md
memory: auto            # -> hypergraph (config + CLI present)
backend: headless       # tmux: one streaming window per harness call in the run session
mode: actor-critic      # a Codex critic grades every changed iteration; a reject becomes
                        # the next iteration's must-fix, not a revert
overseer: agent
idle_interval: 30m
roles:
  actor:
    harness: claude
    model: claude-opus-5
    timeout: 90m
    resume_for: 1
    fallback:
      - { harness: codex, model: gpt-6-astra }   # while Claude is out of usage; back to Claude when it resets
  critic:
    harness: codex
    model: gpt-6-astra
    timeout: 15m
    fallback:
      - { harness: claude, model: claude-opus-5 }
  overseer:
    harness: claude
    model: claude-opus-5
    timeout: 5m
    fallback:
      - { harness: codex, model: gpt-6-astra }
  maintainer:
    harness: claude
    model: claude-fable-5-1
    timeout: 30m
    fallback:
      - { harness: codex, model: gpt-6-astra }
  planner:
    harness: claude
    model: claude-fable-5-1
    timeout: 20m
    fallback:
      - { harness: codex, model: gpt-6-astra }
git:
  branch: null            # -> ouroboros/nt3
  tag_on_accept: true
  revert_on_reject: false # fix forward: the charter forbids reverting this run's own
                          # commits, and the critic's must_fix reaches the next actor
                          # turn either way (engine.py:185). nt2's reverts all failed
                          # and every reject was completed by a later iteration.
  allow_dirty: false
stop:
  after: 15h
  max_iterations: null
  max_cost_usd: null      # subscription; the number is API-equivalent, not a bill
  max_usage: 0.9          # stop at 90% of a subscription window (Codex reports no dollars)
  until: null
  on_done_accepted: null
handoff:
  recent: 3
hypergraph:
  reconcile_every: 5
  pressure: 3
  budget_units: 1
limits:
  cooldown: 30m           # block a limited harness this long when it does not say when it resets; doubles
  max_cooldown: 3h
  transient_strikes: 3
plan:
  enabled: true           # the plan view (short / medium / long) and the planner after each maintainer pass
  every: 5
  view: plan
  md: PLAN.md
  max_new_directions: 1   # per planner pass; the charter bounds what counts as a direction
