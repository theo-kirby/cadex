<!DOCTYPE html>
<!-- SPDX-FileCopyrightText: 2026 Cadex Authors
     SPDX-License-Identifier: LGPL-2.1-or-later
     One Ouroboros run (ADR-513, cut by ADR-533), served at /r/<run>/: the
     charter's done criteria as the run's branch holds them, and its
     iterations newest first, each with the critic's verdict. Writes nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadex run</title>
<link rel="stylesheet" href="review.css">
</head>
<body>
<header id="top">
  <div class="title">
    <a id="home" href="../../" title="All projects and runs">Cadex</a>
    <h1 id="run-name">loading…</h1>
    <div id="run-line"></div>
  </div>
</header>
<main id="projects-frame">
  <section id="charter-card">
    <h2>Charter <span id="charter-count" class="muted small"></span></h2>
    <ul id="charter" class="rows"></ul>
    <p id="charter-empty" class="muted" hidden></p>
  </section>
  <section>
    <h2>Iterations</h2>
    <table class="grid">
      <tbody id="iterations"></tbody>
    </table>
    <p id="iterations-empty" class="muted" hidden>No iterations yet.</p>
  </section>
</main>
<script src="run.js"></script>
</body>
</html>
