<!DOCTYPE html>

     The projects index (`cadex app`, ADR-533): the Ouroboros runs, then the
     projects newest first, a page at a time, each linking to its page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadex</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="review.css">
</head>
<body>
<header id="top">
  <div class="title">
    <h1>Cadex</h1>
  </div>
</header>
<main id="projects-frame">
  <section id="runs-card" hidden>
    <h2>Runs</h2>
    <ul id="runs" class="rows"></ul>
  </section>
  <section>
    <h2>Projects <span id="projects-count" class="muted small"></span></h2>
    <ul id="projects" class="rows"></ul>
    <p id="projects-empty" class="muted" hidden>No projects yet. Start one with
      <code>./cadex -p "a 40x25x15 mm bracket" --project &lt;this directory&gt;/bracket</code>.</p>
    <nav id="pager" class="controls" hidden>
      <button id="page-prev" type="button">Newer</button>
      <span id="page-at"></span>
      <button id="page-next" type="button">Older</button>
    </nav>
  </section>
</main>
<script src="projects.js"></script>
</body>
</html>
