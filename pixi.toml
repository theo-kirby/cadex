[workspace]
name = "cadex"
version = "0.2.0"
description = "Cadex: a headless CAD engine for robots and mechanisms, its read-only dashboard, and MCP agent bindings"
authors = ["Cadex Authors"]
channels = ["conda-forge"]
platforms = [ "linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64" ]
requires-pixi = ">=0.48"

[dependencies]
blinker = "*"
calculix = "*"
ccache = "*"
cmake = "*"
compilers = ">=1.10,<1.11"
defusedxml = "*"
doxygen = "*"
eigen = ">=3.3,<5"
fmt = "*"
freetype = "*"
git = "*"
gtest= "*"
harfbuzz = "*"
hdf5 = "*"
lark = "*"
libboost-devel = "*"
lxml = "*"
ninja = "*"
noqt5 = "*"
numpy = ">=1.26,<1.27"
nlohmann_json = "*"
# Pinned exactly, not to a range: BOPAlgo's subshape ordering is not a
# documented OCCT contract and has changed across releases, and five xscript
# ops take 1-based TopExp::MapShapes ordinals as *saved script arguments*.
# A patch bump that re-indexes them builds different geometry that still
# passes isValid(). See docs/DECISIONS.md ADR-025; its enumeration test went
# with ADR-725, so re-check the ordinals by hand before bumping this.
occt = "==7.8.1"
openssl = "*"
pip = "*"
ply = "*"
pre-commit = "*"
# The engine suite's runner. Undeclared until ADR-060: it happened to be
# importable in the environments the suite was first run in, so
# `pixi run python -m pytest src/Mod/cadex/cadex_tests` -- the command
# CLAUDE.md names as the minimum verification, and the one CI runs -- died
# with "No module named pytest" on any clean checkout, taking both CI jobs
# with it before they reached the packaged gate.
pytest = "*"
pyright = "==1.1.408"
pybind11 = "*"
python = ">=3.11,<3.12"
pythonocc-core = "*"
pyyaml = "*"
qt6-main = ">=6.8,<6.9"
requests = "*"
scipy = "*"
six = "*"
smesh = "*"
swig = "*"
tbb-devel = ">=2022,<2023"
vtk = "*"
xerces-c = "*"
yaml-cpp = "*"
zlib = "*"
zstd = "*"
compiler-rt = ">=18.1.8,<22"

## Linux Dependencies (x86-64)
[target.linux-64.dependencies]
clang = "*"
clangxx = "*"
kernel-headers_linux-64 = "*"
llvm-openmp = "*"
mold = "*"
sed = "*"
sysroot_linux-64 = "*"

## Linux Dependencies (aarch64)
[target.linux-aarch64.dependencies]
clang = "*"
clangxx = "*"
kernel-headers_linux-aarch64 = "*"
llvm-openmp = "*"
mold = "*"
sed = "*"
sysroot_linux-aarch64 = "*"

## macOS Dependencies (Intel)
[target.osx-64.dependencies]
sed = "*"

## macOS Dependencies (Apple Silicon)
[target.osx-arm64.dependencies]
sed = "*"

[target.win-64.dependencies]
pthreads-win32 = "*"

[pypi-dependencies]
freecad-stubs = "*"
# THIS SHIPS. `CARRIED_PYPI_PACKAGES` in
# package/rattler-build/scripts/relocate_conda_environment.py carries the
# wheel into the engine payload as unmanaged copy-verbatim files -- pypi
# wheels have no conda-meta entry, so they need naming rather than
# discovering -- and package/engine/build_engine_payload.sh hard-fails the
# build if the payload cannot *import* mujoco 3.10.0. (This comment said
# "DEVELOPMENT ONLY -- this does NOT ship" until 2026-07-31; it was written
# before ADR-076 and was already wrong when M0 closed.)
#
# It is a pypi wheel rather than the correct home, conda-forge
# `mujoco-python`, because that cannot be installed until the manifest is
# re-solvable: adding any conda dependency forces a full re-solve, which
# failed (qt6-main/occt drift against opencv, vtk, smesh). Since ADR-831 drops
# opencv and the other GUI-era packages, a from-scratch solve succeeds with
# occt, qt6-main, vtk and smesh unchanged; the move to conda is not made yet.
# Pinned exactly for the reason occt is -- MuJoCo disclaims
# cross-version numerical reproducibility, every open_project asserts digest
# equality, and since ADR-081 a version bump also changes every exported
# MJCF file. See docs/DECISIONS.md ADR-075, ADR-076 and docs/MUJOCO.md M0.
mujoco = "==3.10.0"

## Configure presets (all headless: BUILD_GUI=ON is rejected, ADR-022)
[target.linux-64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-linux-debug", "{{ extra_args }}" ], args = [{ "arg" ="extra_args", "default" = "" }], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-linux-release" ], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}

[target.linux-aarch64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-linux-debug", "{{ extra_args }}" ], args = [{ "arg" = "extra_args", "default" = "" }], depends-on= ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-linux-release" ], depends-on= ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}

[target.osx-64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-macos-debug", "{{ extra_args }}" ], args = [{ "arg" = "extra_args", "default" = "" }], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-macos-release" ], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}

[target.osx-arm64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-macos-debug", "{{ extra_args }}" ], args = [{ "arg" = "extra_args", "default" = "" }], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-macos-release" ], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}

[target.win-64.tasks]
configure-debug = { cmd = [ "cmake", "--preset", "conda-windows-debug", "-DCMAKE_GENERATOR_PLATFORM=", "-DCMAKE_GENERATOR_TOOLSET=", "{{ extra_args }}" ], args = [{ "arg" = "extra_args", "default" = "" }], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}
configure-release = { cmd = [ "cmake", "--preset", "conda-windows-release", "-DCMAKE_GENERATOR_PLATFORM=", "-DCMAKE_GENERATOR_TOOLSET=" ], depends-on = ["initialize"], env={ CFLAGS="", CXXFLAGS="", DEBUG_CFLAGS="", DEBUG_CXXFLAGS="" }}

[tasks]
initialize = { cmd = ["git", "submodule", "update", "--init", "--recursive"]}

# ---------------------------------------------------------------------------
# The engine.  One repo, one build (ADR-030); the Blender shell is deleted
# (ADR-498), so there is no application bundle to build or launch.
#
#   pixi run setup-engine && pixi run build-engine
#
#   setup-engine  the one submodule the engine compiles
#   build-engine  the headless engine, BUILD_GUI=OFF
#   stage-engine  stage it into build/engine/cadex-engine-<v>-<os>-<arch>/
#
# `stage-engine` stages; `stage-engine-release` relocates. The difference is
# not a quality setting -- relocation rewrites Mach-O load commands using
# conda's package manifests, so it only works when the engine's own files are
# package-managed, i.e. in a rattler build. Against a `cmake --install`ed
# development environment it fails outright ("the package-managed environment
# is incomplete"). The staged payload is correct on the machine that built it
# and nowhere else.
# ---------------------------------------------------------------------------
setup-engine = { cmd = ["git", "submodule", "update", "--init", "--recursive",
                        "src/3rdParty/OndselSolver"]}
build-engine = { depends-on = ["configure-release", "build-release", "install-release"]}
stage-engine = { cmd = ["bash", "package/engine/build_engine_payload.sh"], env = { CADEX_ENGINE_STAGE_ONLY = "1" }}
stage-engine-release = { cmd = ["bash", "package/engine/build_engine_payload.sh"]}
# The dashboard over a projects directory (`./cadex app`, docs/CLI.md):
# 127.0.0.1:8765, ~/cadex-projects unless --projects or CADEX_PROJECTS says
# otherwise. Extra arguments pass through: `pixi run app --port 0`.
app = { cmd = ["./cadex", "app"]}
# redirect to debug by default
configure = [{ task = "configure-debug" }]
build = [{ task = "build-debug" }]
install = [{ task = "install-debug" }]
test = [{ task = "test-debug" }]

# The suite this project actually lives on: the tests over src/Mod/cadex/,
# headless, no build needed (conftest.py stubs FreeCAD). `test-release` below is
# the *inherited FreeCAD* ctest, which is a different thing (it passes in full,
# 1,526 tests on 2026-10-12, so any failure there is new). Naming both makes which is which
# obvious at the command line instead of in a doc.
#
# A task, not a dependency: ADR-084's pixi.toml prohibition is about
# CARRIED_PYPI_PACKAGES staying one entry long, and this adds nothing to
# solve. Its MJX-gated tests skip here by design; to run
# them, use a venv built from training/requirements.txt.
test-engine = { cmd = ["python", "-m", "pytest", "src/Mod/cadex/cadex_tests"]}

build-debug = { cmd = ["cmake", "--build", "build/debug"]}
build-release = { cmd = ["cmake", "--build", "build/release"]}
install-debug = { cmd = ["cmake", "--install", "build/debug"]}
install-release = { cmd = ["cmake", "--install", "build/release"]}
test-debug = { cmd = ["ctest", "--test-dir", "build/debug"]}
test-release = { cmd = ["ctest", "--test-dir", "build/release"]}
# Headless project rebuild: re-run THE script into a fresh document and
# verify the content digest against the accepted one (docs/XSCRIPT.md).
rebuild = { cmd = [".pixi/envs/default/bin/FreeCADCmd", "-c", "import sys; sys.path.insert(0, 'src/Mod/cadex'); import cadex_rebuild; raise SystemExit(cadex_rebuild.main(['{{ root }}']))"], args = [{ "arg" = "root" }]}
# cadexd: the headless xscript engine service speaking cadex-cadexd-v1
# NDJSON over stdio (docs/INTEGRATION.md, ADR-017). One process per project;
# the client (the CLI, or a test harness) owns stdin/stdout.
cadexd = { cmd = [".pixi/envs/default/bin/FreeCADCmd", "-c", "import sys; sys.path.insert(0, 'src/Mod/cadex'); import cadexd; raise SystemExit(cadexd.main())"]}
# There is no task that launches a FreeCAD application: no build produces one
# (BUILD_GUI is always OFF, ADR-022, ADR-214). The `freecad*` tasks went in
# ADR-674.
