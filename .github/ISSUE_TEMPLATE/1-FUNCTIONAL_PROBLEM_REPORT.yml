name: Report a Problem
description: Tell us about something that is broken, difficult to use, or missing.
labels: ["Status: Needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Cadex. Describe the problem in your own words.
        A project directory (zipped), the script, `--json` output and logs all help,
        but none is required.

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened, what you were doing, and what you expected instead. Drag images, logs or ZIP archives here to attach them.
      placeholder: What went wrong, or what is unnecessarily difficult or missing?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area affected
      options:
        - Engine (build, xscript, cadexd, workers)
        - Dynamics and training (MuJoCo, tasks, policies)
        - Dashboard (cadex app)
        - Agent bindings (cadex mcp, guidance, tools)
        - CLI (other cadex commands)
        - Build and setup (pixi, CMake)
        - Documentation
        - Other (specify in description)

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce (optional)
      description: The shortest sequence that causes it, if it repeats.
      placeholder: |
        1. ./cadex mcp --project ...
        2. The agent calls write_script with ...
        3. The build is refused with ...

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs or error messages (optional)
      description: Terminal output, the `--json` envelope, or the project's activity log. Remove secrets first.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: Output of `./cadex --version`, the OS, and the agent that drove it, if any.
      placeholder: |
        cadex --version:
        OS:
        Agent (Claude Code, Codex, ...):
